      "projectContent.sidi-abdallah-200-1200-housing.summary.0": "يُعد مشروع السكن العمومي الترقوي (200/1200 وحدة) مشروعاً متعدد الاستخدامات، ويقع في سيدي عبد الله بالجزائر العاصمة.",
      "projectContent.sidi-abdallah-200-1200-housing.summary.1": "عقد رئيسي للإسكان العام تم إنجازه بالتزامن مع أعمال لهيئات حكومية فرعية وتنفيذ منسق للبرنامج.",
      "projectContent.sidi-abdallah-200-1200-housing.description.0": "أعمال إنشاء كافة المرافق العامة الثانوية (التجهيزات العمومية) ضمن مشروع السكن العمومي الترقوي (200/1200 وحدة) في سيدي عبد الله - المحالمة. البرنامج: وحدات سكنية من نوع السكن العمومي الترقوي (LPP).",
      "projectContent.sidi-abdallah-200-1200-housing.description.1": "عقد رئيسي للإسكان العام تم إنجازه بالتزامن مع أعمال لهيئات حكومية أخرى وتنفيذ منسق للبرنامج. النطاق: مشاريع إسكان عام واسعة النطاق تشمل حزم دعم إنشائي متكاملة.",
      "projectContent.sidi-abdallah-200-1200-housing.authority": "تتولى شركة \"Igloo Construction\" تنسيق عمليات التسليم بالدقة والالتزام اللازمين لمشاريع الوحدات السكنية العامة الترويجية (LPP)، وهي مشاريع إسكان عام واسعة النطاق مدعومة بحزم متكاملة من خدمات الدعم الإنشائي.",
      "projectContent.sidi-abdallah-200-1200-housing.seo": "اطلع على معرض الصور والتفاصيل الفنية وملاحظات الموقع الخاصة بمشروع الإسكان العام الترويجي (200/1200). يجسد المشروع نموذجاً لتنفيذ مشاريع سكنية ومتعددة الاستخدامات تقودها الجهة المصدرة للمشروع.",
