      "projectContent.douaouda-300-500-housing.images.constructionGallery.2.caption": "مبانٍ سكنية أُنجزت حديثاً في دواودة.",
      "projectContent.douaouda-300-500-housing.images.constructionGallery.3.alt": "مجموعة من المباني السكنية متعددة الطوابق ذات واجهات فاتحة اللون ولمسات بنية، تظهر في المشهد من زاوية منخفضة. تظهر في المقدمة ساحة موقع بناء ترابي تتناثر فيها أكوام من الرمل والطوب وأكياس بيضاء، بينما تبدو السماء ملبدة بالغيوم فوق المباني.",
