      "projectContent.reghaia-bouraada-250-housing.faq.0.question": "ما المقصود بـ 250 وحدة سكنية مع مساحات تجارية للإيجار وخدمات الكونسيرج؟",
      "projectContent.reghaia-bouraada-250-housing.faq.0.answer": "يقع مشروع يضم 250 وحدة سكنية - بنظام الإيجار المنتهي بالتمليك - ومحلات تجارية وخدمات استقبال (كونسيرج) في منطقة \"بوراد\" ببلدية رغاية في الجزائر العاصمة.",
      "projectContent.reghaia-bouraada-250-housing.faq.1.question": "ما هو نطاق المشروع؟",
      "projectContent.reghaia-bouraada-250-housing.faq.1.answer": "مشروع سكني قيد التنفيذ يجمع بين وحدات سكنية مخصصة للبيع والإيجار ومساحات تجارية وخدمات الاستقبال والإرشاد (الكونسيرج). ويشمل المشروع إنجاز وحدات سكنية إلى جانب مرافق تجارية ومساحات مخصصة لخدمات الاستقبال والدعم.",
      "projectContent.reghaia-bouraada-250-housing.faq.2.question": "Who led the التسليم?",
      "projectContent.reghaia-bouraada-250-housing.faq.2.answer": "الزبون: AADL.",
      "projectContent.reghaia-bouraada-250-housing.faq.3.question": "ما الذي يجعل المشروع مميزاً؟",
      "projectContent.reghaia-bouraada-250-housing.faq.3.answer": "أعمال إنشاء الوحدات السكنية المتبقية (عددها 250 وحدة) المخصصة للبيع أو التأجير التجاري، بما في ذلك مساحات للاستخدام التجاري وخدمات الاستقبال والإشراف (الكونسيرج) في موقع \"بورادة\" بالرغاية. إنجاز الوحدات السكنية مع توفير مرافق تجارية ومساحات مخصصة لخدمات الاستقبال والإشراف.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.0.alt": "تصميم ثلاثي الأبعاد يظهر الواجهة الخارجية لمبنى سكني وتجاري متعدد الطوابق ذي تصميم عصري، يتميز بألواح باللون الأصفر والأبيض والرمادي الداكن، وشرفات، ومساحات تجارية في الطابق الأرضي، وذلك على خلفية سماء داكنة وملبدة بالغيوم.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.0.caption": "رؤية مجمع \"بورادة\" السكني والتجاري.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.1.alt": "تصور معماري ثلاثي الأبعاد يظهر الواجهة الكاملة لمبنى سكني عصري متعدد الطوابق يتميز بألواح باللون الأبيض والأصفر والرمادي الداكن، ومساحات تجارية في الطابق الأرضي، بالإضافة إلى منطقة ممهدة تضم مواقف للسيارات ومساحات خضراء في المقدمة، وذلك تحت سماء ملبدة بالغيوم.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.1.caption": "تصور معماري لمشروع \"بورادة\" السكني.",
      "projectContent.reghaia-bouraada-250-housing.images.intro.alt": "مبنى سكني شاهق وعصري يتميز بواجهة لافتة تجمع بين الألوان الأصفر والأسود والأبيض وتضم شرفات متعددة، وذلك على خلفية سماء زرقاء صافية. وتظهر في المقدمة أعمال بناء جارية، حيث تتناثر الأتربة وتوجد أحجار رصيف تم تركيبها حديثاً.",
      "projectContent.reghaia-bouraada-250-housing.images.intro.caption": "مبنى سكني عصري بلمسات باللونين الأصفر والأسود قيد الإنشاء.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.0.alt": "لقطة علوية لمبنى متعدد الطوابق قيد الإنشاء تظهر فيه أعمال الطوب والهياكل الخرسانية المكشوفة، ورافعة برجية زرقاء كبيرة، ومركبات إنشائية، ومكاتب موقع مؤقتة على أرض ترابية.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.0.caption": "تقدم أعمال البناء في موقع \"بورادة\"، وتظهر في الصورة رافعة برجية وهياكل المباني.",
