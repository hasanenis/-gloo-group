      "projectContent.dely-brahim-240-housing.faq.0.question": "ما هو مشروع 240 سكنًا ترويجيًا حرًا مع محلات تجارية؟",
      "projectContent.dely-brahim-240-housing.faq.0.answer": "يقع المشروع في دالي إبراهيم بالجزائر، ويضم 240 سكنًا ترويجيًا حرًا مع محلات تجارية وخدمات.",
      "projectContent.dely-brahim-240-housing.faq.1.question": "ما نطاق المشروع؟",
      "projectContent.dely-brahim-240-housing.faq.1.answer": "يشمل السكنات والمحلات والخدمات والطرقات والشبكات وموقف السيارات تحت الأرض.",
      "projectContent.dely-brahim-240-housing.faq.2.question": "ما الذي يميز المشروع؟",
      "projectContent.dely-brahim-240-housing.faq.2.answer": "يجمع برنامجًا سكنيًا كثيفًا مع المحلات والخدمات وموقف السيارات تحت الأرض ضمن تخطيط متعدد الاستعمالات.",
      "projectContent.dely-brahim-240-housing.images.hero.0.alt": "منظر ليلي لمبنى معاصر متعدد الاستعمالات بشرفات سكنية مضاءة ومحلات نابضة بالحياة وموقف سيارات تحت الأرض، بجانب شارع تمر فيه السيارات وأشجار.",
      "projectContent.dely-brahim-240-housing.images.hero.0.caption": "مبنى متعدد الاستعمالات يضم سكنًا ومحلات وموقف سيارات، مضاء ليلًا.",
      "projectContent.dely-brahim-240-housing.images.hero.1.alt": "مبنى حديث متعدد الطوابق ليلًا؛ محلات مضاءة في الطابق الأرضي ووحدات سكنية بشرفات في الأعلى، مع سيارات ومشاة في الشارع.",
      "projectContent.dely-brahim-240-housing.images.hero.1.caption": "مبنى متعدد الاستعمالات بوحدات تجارية وسكنية مضاءة ليلًا.",
      "projectContent.dely-brahim-240-housing.images.intro.alt": "مبنى سكني معاصر مرتفع بشرفات مضاءة ومحلات في الطابق الأرضي، أمام سماء مسائية زرقاء داكنة.",
      "projectContent.dely-brahim-240-housing.images.intro.caption": "مبنى مرتفع حديث بوحدات تجارية وسكنية مضاءة ليلًا.",
