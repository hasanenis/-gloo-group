      "projectContent.reghaia-bouraada-250-housing.seo": "اطلع على معرض الصور والمواصفات الفنية وتفاصيل الموقع الخاصة بمشروع يضم 250 وحدة سكنية، مع توفير مساحات تجارية للإيجار وخدمات الكونسيرج. يجسد المشروع نموذجاً لتطوير المشاريع السكنية ومتعددة الاستخدامات يعتمد على نهج رائد في التنفيذ.",
