      "projectContent.sidi-abdallah-200-1200-housing.faq.0.question": "ما هو برنامج الإسكان العام الترويجي \"200/1200\"؟",
      "projectContent.sidi-abdallah-200-1200-housing.faq.0.answer": "يقع مشروع السكن العمومي الترقوي (200/1200 وحدة) في سيدي عبد الله، الجزائر العاصمة، الجزائر. وهو مشروع يندرج ضمن فئة السكن العمومي الترقوي (LPP).",
      "projectContent.sidi-abdallah-200-1200-housing.faq.1.question": "ما هو نطاق المشروع؟",
      "projectContent.sidi-abdallah-200-1200-housing.faq.1.answer": "عقد رئيسي للإسكان العام تم إنجازه بالتزامن مع أعمال لهيئات حكومية أخرى وتنفيذ منسق للبرنامج؛ ويشمل المشروع إسكاناً عاماً واسع النطاق مع حزم متكاملة لدعم أعمال البناء.",
      "projectContent.sidi-abdallah-200-1200-housing.faq.2.question": "ما الذي يجعل المشروع مميزاً؟",
      "projectContent.sidi-abdallah-200-1200-housing.faq.2.answer": "أعمال الإنشاءات الخاصة بجميع الهيئات الحكومية الثانوية ضمن مشروع السكن العمومي الترقوي (بمعدل 200 من أصل 1200 وحدة سكنية) في سيدي عبد الله - المحالمة؛ وهو مشروع سكني عام واسع النطاق يتضمن حزم دعم إنشائي متكاملة.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.0.alt": "مبنى سكني شاهق وعصري يُرى من الأسفل، ويُبرز واجهته الخارجية ذات اللونين البيج والخوخي مع لمسات باللون الأسود، وشرفات متعددة، ونوافذ مضاءة.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.0.caption": "واجهة سكن عام عصري تتميز بعناصر معمارية فريدة.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.1.alt": "مبنى شاهق وعصري للسكن العام يُرى من زاوية منخفضة، يتميز بجدران فاتحة اللون تتخللها لمسات باللونين الأسود والخوخي، وشرفات متعددة ذات درابزين داكن، وأضواء داخلية متوهجة تظهر عبر بعض النوافذ، كل ذلك على خلفية سماء رمادية ملبدة بالغيوم.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.1.caption": "عمارة حديثة للإسكان العام تتميز بواجهة وشرفات فريدة.",
      "projectContent.sidi-abdallah-200-1200-housing.images.intro.alt": "مساحة مشتركة داخلية في مبنى سكني عام، تتميز بجدران حجرية فاتحة اللون، وعناصر خشبية عمودية، وحوض نباتات مدمج، وأرضية رخامية منقوشة تؤدي إلى باب شبكي معدني مزخرف.",
      "projectContent.sidi-abdallah-200-1200-housing.images.intro.caption": "تصميم داخلي عصري وجذاب للمساحة المشتركة.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.0.alt": "منطقة مشتركة داخلية في مبنى سكني عام، تضم مصعداً مركزياً وصناديق بريد خشبية على اليسار، بالإضافة إلى درابزين معدني مزخرف في الطابق العلوي. وتتميز المساحة بكسوة من الرخام والحجر، وإضاءة مدمجة، وجدارية مزينة بنقوش لأشجار.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.0.caption": "مساحات مشتركة ومرافق راقية في مشروع الإسكان العام.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.1.alt": "لقطة واسعة تُظهر عدة مبانٍ سكنية شاهقة ومتعددة الطوابق ذات واجهات بألوان البيج والأزرق الداكن والخوخي. تقع المباني في موقع إنشائي يضم تربة مائلة للحمرة، وأكواماً من الأنابيب الحمراء، وكتلاً خرسانية، وشاحنة بناء بيضاء، وحفارة صفراء. ويظهر رجلان يمشيان في مقدمة المشهد، بينما تبدو السماء ملبدة بالغيوم.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.1.caption": "مشروع الإسكان العام يقترب من الاكتمال، مع استمرار أعمال البنية التحتية للموقع.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.2.alt": "مساحة مشتركة داخلية في مبنى سكني عام، تتميز بجدران حجرية فاتحة اللون، وعناصر خشبية عمودية، وحوض نباتات مدمج، وأرضية رخامية منقوشة تؤدي إلى باب شبكي معدني مزخرف.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.2.caption": "تصميم داخلي عصري وجذاب للمساحة المشتركة.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.3.alt": "مبنى شاهق وعصري للسكن العام يُرى من زاوية منخفضة، يتميز بجدران فاتحة اللون تتخللها لمسات باللونين الأسود والخوخي، وشرفات متعددة ذات درابزين داكن، وأضواء داخلية متوهجة تظهر عبر بعض النوافذ، كل ذلك على خلفية سماء رمادية ملبدة بالغيوم.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.3.caption": "عمارة حديثة للإسكان العام تتميز بواجهة وشرفات فريدة.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.0.alt": "مبنيان شاهقان وعصريان مخصصان للإسكان العام، يتميزان بواجهات بألوان الأبيض والأزرق والخوخي، ويبرزان أمام سماء زرقاء صافية. وتظهر في المقدمة أكوام من الأتربة ومواد البناء، مما يشير إلى استمرار أعمال الإنشاء في الموقع.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.0.caption": "مبانٍ حديثة للإسكان العام تشهد أعمالاً جارية في الموقع.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.1.alt": "مساحة مشتركة داخلية في مبنى سكني عام، تتميز بجدران حجرية فاتحة اللون، وعناصر خشبية عمودية، وحوض نباتات مدمج، وأرضية رخامية منقوشة تؤدي إلى باب شبكي معدني مزخرف.",
