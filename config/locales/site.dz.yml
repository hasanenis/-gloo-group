      "projectContent.reghaia-bouraada-250-housing.summary.0": "يُعد مشروع \"250 وحدة سكنية مع مساحات تجارية للإيجار وخدمات الكونسيرج\" مشروعاً متعدد الاستخدامات، ويقع في منطقة \"بوراد\" ببلدية \"رغاية\" في الجزائر العاصمة.",
