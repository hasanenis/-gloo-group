      "projectContent.douaouda-300-500-housing.faq.0.question": "ما هو برنامج 300/500 سكن ترويجي مدعّم؟",
      "projectContent.douaouda-300-500-housing.faq.0.answer": "يقع البرنامج في الدواودة بولاية تيبازة، ويضم سكنات ترويجية مدعّمة ومساحات للاستعمال المهني.",
      "projectContent.douaouda-300-500-housing.faq.1.question": "ما نطاق المشروع؟",
      "projectContent.douaouda-300-500-housing.faq.1.answer": "يشمل الهياكل الثانوية والبنية التحتية المنسقة للموقع والأشغال التكميلية الخاصة بالبرنامج السكني.",
      "projectContent.douaouda-300-500-housing.faq.2.question": "من أشرف على التنفيذ؟",
      "projectContent.douaouda-300-500-housing.faq.2.answer": "الزبون: AADL.",
      "projectContent.douaouda-300-500-housing.faq.3.question": "ما الذي يميز المشروع؟",
      "projectContent.douaouda-300-500-housing.faq.3.answer": "يعالج برنامجًا سكنيًا مدعّمًا واسع النطاق مع مساحات مهنية وبنية تحتية للموقع ضمن تنفيذ واحد.",
      "projectContent.douaouda-300-500-housing.images.hero.0.alt": "لقطة واسعة لموقع بناء كبير يضم عدة مبانٍ سكنية خرسانية متعددة الطوابق في مراحل متفاوتة من الإنجاز الإنشائي. وتظهر في الخلفية رافعة برجية شاهقة تمتد فوق المباني، بينما تغطي الأرضية تربة ذات لون بني محمر، وتكتسي السماء بالغيوم.",
      "projectContent.douaouda-300-500-housing.images.hero.0.caption": "الأعمال الإنشائية جارية في المباني السكنية.",
      "projectContent.douaouda-300-500-housing.images.hero.1.alt": "لقطة عمودية لموقع بناء تحت سماء زرقاء صافية. تظهر في المقدمة تربة محفورة بلون بني محمر وبعض الغطاء النباتي الأخضر. وفي المنطقة الوسطى، يبرز هيكل خرساني رمادي شاهق (يُرجح أنه قلب المبنى الإنشائي) تعلوه قوالب صب حمراء، وإلى يمينه مبنى آخر متعدد الطوابق يتميز بإطارات خرسانية وجدران حشو من الطوب الأحمر. وتمتد عبر السماء رافعة برجية زرقاء كبيرة تحمل اسم \"UNEN COMANSA\" على ذراعها، وتظهر أسفلها شاحنة مضخة خرسانة وشاحنتان لخلط الأسمنت. أما في الخلفية البعيدة، فيظهر البحر الأزرق.",
      "projectContent.douaouda-300-500-housing.images.hero.1.caption": "الأعمال الإنشائية جارية في مشروع \"دواودة\" السكني.",
      "projectContent.douaouda-300-500-housing.images.intro.alt": "لقطة جوية تُظهر عدة مجمعات سكنية كبيرة ذات لون بيج وأسطح بنية، تحيط بها أرض غير معبدة وبعض مواد البناء. وتظهر في المقدمة مبانٍ أقدم وأصغر حجماً، بينما يبدو مسطح مائي في الخلفية البعيدة تحت سماء ملبدة بالغيوم.",
      "projectContent.douaouda-300-500-housing.images.intro.caption": "مبانٍ سكنية أُنجزت حديثاً في دواودة.",
      "projectContent.douaouda-300-500-housing.images.mosaic.0.alt": "مجموعة من المباني السكنية متعددة الطوابق ذات واجهات فاتحة اللون ولمسات بنية، تظهر في المشهد من زاوية منخفضة. تظهر في المقدمة ساحة موقع بناء ترابي تتناثر فيها أكوام من الرمل والطوب وأكياس بيضاء، بينما تبدو السماء ملبدة بالغيوم فوق المباني.",
      "projectContent.douaouda-300-500-housing.images.mosaic.0.caption": "مبانٍ سكنية مكتملة حديثاً مع استمرار الأعمال في الموقع.",
      "projectContent.douaouda-300-500-housing.images.mosaic.1.alt": "لقطة واسعة لموقع بناء كبير يضم عدة مبانٍ سكنية خرسانية متعددة الطوابق في مراحل متفاوتة من الإنجاز الإنشائي. وتظهر في الخلفية رافعة برجية شاهقة تمتد فوق المباني، بينما تغطي الأرضية تربة ذات لون بني محمر، وتكتسي السماء بالغيوم.",
      "projectContent.douaouda-300-500-housing.images.mosaic.1.caption": "الأعمال الإنشائية جارية في المباني السكنية.",
      "projectContent.douaouda-300-500-housing.images.mosaic.2.alt": "لقطة عمودية لموقع بناء تحت سماء زرقاء صافية. تظهر في المقدمة تربة محفورة بلون بني محمر وبعض الغطاء النباتي الأخضر. وفي المنطقة الوسطى، يبرز هيكل خرساني رمادي شاهق (يُرجح أنه قلب المبنى الإنشائي) تعلوه قوالب صب حمراء، وإلى يمينه مبنى آخر متعدد الطوابق يتميز بإطارات خرسانية وجدران حشو من الطوب الأحمر. وتمتد عبر السماء رافعة برجية زرقاء كبيرة تحمل اسم \"UNEN COMANSA\" على ذراعها، وتظهر أسفلها شاحنة مضخة خرسانة وشاحنتان لخلط الأسمنت. أما في الخلفية البعيدة، فيظهر البحر الأزرق.",
      "projectContent.douaouda-300-500-housing.images.mosaic.2.caption": "الأعمال الإنشائية جارية في مشروع \"دواودة\" السكني.",
      "projectContent.douaouda-300-500-housing.images.mosaic.3.alt": "لقطة جوية تُظهر عدة مجمعات سكنية كبيرة ذات لون بيج وأسطح بنية، تحيط بها أرض غير معبدة وبعض مواد البناء. وتظهر في المقدمة مبانٍ أقدم وأصغر حجماً، بينما يبدو مسطح مائي في الخلفية البعيدة تحت سماء ملبدة بالغيوم.",
      "projectContent.douaouda-300-500-housing.images.mosaic.3.caption": "مبانٍ سكنية أُنجزت حديثاً في دواودة.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.0.alt": "مشهد لعدة مبانٍ سكنية حديثة ومتعددة الطوابق، تتميز بواجهات فاتحة اللون ولمسات بنية، وتقع تحت سماء ملبدة بالغيوم. وتظهر في المقدمة مواد بناء مثل الطوب والرمل والأكياس البيضاء.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.0.caption": "مبانٍ سكنية مكتملة في دواودة مع استمرار الأعمال في الموقع.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.1.alt": "لقطة عمودية لموقع بناء تحت سماء زرقاء صافية. تظهر في المقدمة تربة محفورة بلون بني محمر وبعض الغطاء النباتي الأخضر. وفي المنطقة الوسطى، يبرز هيكل خرساني رمادي شاهق (يُرجح أنه قلب المبنى الإنشائي) تعلوه قوالب صب حمراء، وإلى يمينه مبنى آخر متعدد الطوابق يتميز بإطارات خرسانية وجدران حشو من الطوب الأحمر. وتمتد عبر السماء رافعة برجية زرقاء كبيرة تحمل اسم \"UNEN COMANSA\" على ذراعها، وتظهر أسفلها شاحنة مضخة خرسانة وشاحنتان لخلط الأسمنت. أما في الخلفية البعيدة، فيظهر البحر الأزرق.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.1.caption": "الأعمال الإنشائية جارية في مشروع \"دواودة\" السكني.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.2.alt": "لقطة واسعة لموقع بناء كبير يضم عدة مبانٍ سكنية خرسانية متعددة الطوابق في مراحل متفاوتة من الإنجاز الإنشائي. وتظهر في الخلفية رافعة برجية شاهقة تمتد فوق المباني، بينما تغطي الأرضية تربة ذات لون بني محمر، وتكتسي السماء بالغيوم.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.2.caption": "الأعمال الإنشائية جارية في المباني السكنية.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.3.alt": "لقطة جوية تُظهر عدة مجمعات سكنية كبيرة ذات لون بيج وأسطح بنية، تحيط بها أرض غير معبدة وبعض مواد البناء. وتظهر في المقدمة مبانٍ أقدم وأصغر حجماً، بينما يبدو مسطح مائي في الخلفية البعيدة تحت سماء ملبدة بالغيوم.",
