      "projectContent.staoueli-11-41-villas.faq.0.question": "ما هو مشروع \"فلل وأعمال الشبكة 11/41\"؟",
      "projectContent.staoueli-11-41-villas.faq.0.answer": "يقع مشروع \"11/41 للفيلات وأعمال الشبكات\" في سطاوالي - الجزائر العاصمة - الجزائر، وهو عبارة عن فيلات سكنية ترويجية حرة.",
      "projectContent.staoueli-11-41-villas.faq.1.question": "ما هو نطاق المشروع؟",
      "projectContent.staoueli-11-41-villas.faq.1.answer": "يجمع البرنامج بين حزم إنشاء الفيلات وأعمال الطرق وشبكات المرافق اللازمة لضمان الجاهزية الكاملة للموقع؛ إذ يشمل فيلات سكنية إلى جانب الطرق وشبكات المرافق والبنية التحتية المتكاملة للموقع.",
      "projectContent.staoueli-11-41-villas.faq.2.question": "ما الذي يجعل المشروع مميزاً؟",
      "projectContent.staoueli-11-41-villas.faq.2.answer": "أعمال الإنشاءات الخاصة بالمرافق التابعة للجهات الحكومية، بما في ذلك مختلف أعمال الطرق والشبكات لمشروع الـ 41 فيلا (الموقع 11) في سطاوالي؛ ويشمل المشروع فيلات سكنية، وطرقاً، وشبكات مرافق، وبنية تحتية منسقة للموقع.",
      "projectContent.staoueli-11-41-villas.images.hero.0.alt": "مشهد خارجي لفيلات سكنية مكتملة حديثاً، تتميز بواجهات فاتحة اللون ولمسات داكنة وشرفات ذات درابزين زجاجي وأسقف مغطاة بالقرميد الأحمر، وذلك تحت سماء زرقاء صافية.",
      "projectContent.staoueli-11-41-villas.images.hero.0.caption": "فلل سكنية مكتملة البناء بتصميم عصري وشرفات.",
      "projectContent.staoueli-11-41-villas.images.hero.1.alt": "واجهة مبنى سكني متعدد الطوابق يتميز بجدران بيضاء ووردية فاتحة، وتفاصيل معمارية باللون الرمادي الداكن، وشرفات ذات واجهات زجاجية، ومظلات خشبية تعلو مداخل الطابق الأرضي وأبواب المرآب؛ كما يظهر ممر مرصوف في المقدمة.",
      "projectContent.staoueli-11-41-villas.images.hero.1.caption": "فلل سكنية عصرية بتشطيبات أنيقة وشرفات خاصة.",
      "projectContent.staoueli-11-41-villas.images.intro.alt": "صفٌّ من الفيلات السكنية العصرية ذات الألوان الفاتحة، والتي تتميز بلمسات داكنة وشرفات زجاجية وأسقف من قرميد التراكوتا، تعلوها سماء زرقاء صافية.",
      "projectContent.staoueli-11-41-villas.images.intro.caption": "فلل سكنية مكتملة البناء بتصميم عصري وشرفات زجاجية.",
      "projectContent.staoueli-11-41-villas.images.mosaic.0.alt": "مطبخ مكتمل التشطيب حديثاً يتميز ببلاط أرضية داكن ولامع بنقوش رخامية، وخزائن سفلية بلون كريمي فاتح، وأسطح عمل داكنة، وجدار خلفي بنقوش هندسية رمادية وبيضاء، وخزائن علوية بلون خشبي بني داكن. وتظهر قطعة قماش زرقاء على الأرضية في المقدمة.",
      "projectContent.staoueli-11-41-villas.images.mosaic.0.caption": "تصميم داخلي لمطبخ عصري يتميز بكسوة جدارية خلفية منقوشة وأرضية داكنة بمظهر الرخام.",
      "projectContent.staoueli-11-41-villas.images.mosaic.1.alt": "فيلا سكنية متعددة الطوابق قيد الإنشاء، تظهر عليها سقالات على الواجهة وخرسانة مكشوفة عند القاعدة، مع وجود عاملين يستريحان في شرفة علوية.",
      "projectContent.staoueli-11-41-villas.images.mosaic.1.caption": "سير العمل في فيلا سكنية، مع إبراز التشطيبات الخارجية والسقالات.",
      "projectContent.staoueli-11-41-villas.images.mosaic.2.alt": "واجهة مبنى سكني متعدد الطوابق يتميز بجدران بيضاء ووردية فاتحة، وتفاصيل معمارية باللون الرمادي الداكن، وشرفات ذات واجهات زجاجية، ومظلات خشبية تعلو مداخل الطابق الأرضي وأبواب المرآب؛ كما يظهر ممر مرصوف في المقدمة.",
      "projectContent.staoueli-11-41-villas.images.mosaic.2.caption": "فلل سكنية عصرية بتشطيبات أنيقة وشرفات خاصة.",
      "projectContent.staoueli-11-41-villas.images.mosaic.3.alt": "مشهد خارجي لفيلات سكنية مكتملة حديثاً، تتميز بواجهات فاتحة اللون ولمسات داكنة وشرفات ذات درابزين زجاجي وأسقف مغطاة بالقرميد الأحمر، وذلك تحت سماء زرقاء صافية.",
      "projectContent.staoueli-11-41-villas.images.mosaic.3.caption": "فلل سكنية مكتملة البناء بتصميم عصري وشرفات.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.0.alt": "مطبخ عصري بتصميم على شكل حرف L في فيلا سكنية، يتميز بأسطح عمل من الجرانيت الداكن، وخزائن سفلية بلون كريمي فاتح، وخزائن علوية بيضاء، وأخرى جدارية بمظهر خشبي بني داكن. يضم المطبخ موقداً غازياً، وحوض غسيل مزدوجاً من الفولاذ المقاوم للصدأ، وجداراً خلفياً مزيناً ببلاط منقوش، بالإضافة إلى أرضية من البلاط بمظهر الرخام الداكن.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.0.caption": "مطبخ عصري يتميز بكسوة جدارية منقوشة وتشطيبات داكنة.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.1.alt": "واجهة خارجية لفيلا سكنية متعددة الطوابق تتميز بجدران ذات لون بيج فاتح وإطارات نوافذ داكنة وشرفات ذات درابزين من الزجاج والمعدن. يظهر سقف مغطى ببلاط التراكوتا، بينما تحجب عارضة خرسانية كبيرة الجزء العلوي من الصورة. وتظهر علامة زمنية تشير إلى \"2022.9.21 11:52\" في الزاوية اليمنى السفلية.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.1.caption": "واجهة خارجية للفيلا مكتملة بتشطيبات عصرية.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.2.alt": "واجهة مبنى سكني متعدد الطوابق يتميز بجدران بيضاء ووردية فاتحة، وتفاصيل معمارية باللون الرمادي الداكن، وشرفات ذات واجهات زجاجية، ومظلات خشبية تعلو مداخل الطابق الأرضي وأبواب المرآب؛ كما يظهر ممر مرصوف في المقدمة.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.2.caption": "فلل سكنية عصرية بتشطيبات أنيقة وشرفات خاصة.",
