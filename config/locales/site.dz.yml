      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.3.alt": "درج منحنٍ وفخم يضم درجات من الجرانيت الرمادي ودرابزيناً من الفولاذ المقاوم للصدأ اللامع، يقع في ردهة مبنى تجاري عصري ومضيء؛ وتظهر في الخلفية جدران بيضاء وأبواب ذات إطارات سوداء.",
