      "projectContent.reghaia-bouraada-250-housing.description.0": "أعمال إنشاء الوحدات السكنية المتبقية (عددها 250 وحدة) والمخصصة للبيع بنظام الإيجار المنتهي بالتمليك، مع توفير مساحات للاستخدام التجاري وخدمات الحراسة والاستقبال في موقع \"بورادة\" ببلدية الرغاية.",
      "projectContent.reghaia-bouraada-250-housing.description.1": "مشروع سكني قيد التنفيذ يجمع بين وحدات سكنية مخصصة للبيع والإيجار ومساحات تجارية وخدمات الاستقبال والإرشاد (الكونسيرج). نطاق العمل: إنجاز الوحدات السكنية مع المساحات التجارية ومرافق خدمات الاستقبال والإرشاد.",
