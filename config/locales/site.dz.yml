      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.3.alt": "تصميم داخلي لمركز تجاري عصري ومضيء، يبرز فيه درج متعدد المستويات ذو درجات بيضاء ودرابزين أنيق من الفولاذ المقاوم للصدأ. وتظهر في الخلفية نوافذ كبيرة تغمر المساحة النظيفة والخالية بضوء النهار الطبيعي.",
