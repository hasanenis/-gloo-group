      "projectContent.rouiba-4-promotional-villas.images.mosaic.2.alt": "لقطة مرتفعة لعدة فيلات بيضاء شُيدت حديثاً، وتتميز بطراز معماري عصري وأسطح مسطحة وشرفات. يظهر جزء من ذراع رافعة بناء على اليسار، بينما تظهر في الخلفية منطقة سكنية مكتظة.",
