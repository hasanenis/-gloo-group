      "projectContent.douira-commercial-centers-2500-housing.images.hero.0.alt": "مشهد داخلي لوحدة تجارية عصرية تتميز بجدران بيضاء وأرضية مبلطة وإضاءة مدمجة في السقف، وتُرى من خلال فاصل زجاجي ذي إطار أسود. يظهر عامل بالقرب من نافذة كبيرة في الخلفية تطل على مبنى آخر.",
      "projectContent.douira-commercial-centers-2500-housing.images.hero.0.caption": "تصميم داخلي لوحدة تجارية مكتمل حديثاً.",
      "projectContent.douira-commercial-centers-2500-housing.images.hero.1.alt": "مشهد خارجي لمبنى تجاري عصري مكون من ثلاثة طوابق، يتميز بألواح رمادية داكنة وحواف نحاسية، ويقع بين برجين سكنيين فاتحي اللون، مع وجود شارع وسيارة متوقفة في المقدمة.",
      "projectContent.douira-commercial-centers-2500-housing.images.hero.1.caption": "مركز تجاري مُنجَز يخدم مشروعاً سكنياً كبيراً.",
      "projectContent.douira-commercial-centers-2500-housing.images.intro.alt": "تصميم داخلي لمركز تجاري عصري ومضيء، يبرز فيه درج متعدد المستويات ذو درجات بيضاء ودرابزين أنيق من الفولاذ المقاوم للصدأ. وتظهر في الخلفية نوافذ كبيرة تغمر المساحة النظيفة والخالية بضوء النهار الطبيعي.",
      "projectContent.douira-commercial-centers-2500-housing.images.intro.caption": "تصميم داخلي عصري لمركز تجاري يضم سلماً متعدد المستويات.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.0.alt": "درج منحنٍ وفخم يضم درجات من الجرانيت الرمادي ودرابزيناً من الفولاذ المقاوم للصدأ اللامع، يقع في ردهة مبنى تجاري عصري ومضيء؛ وتظهر في الخلفية جدران بيضاء وأبواب ذات إطارات سوداء.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.0.caption": "سلم منحني أنيق في مركز تجاري جديد.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.1.alt": "درجان كبيران ومنحنيان، مزودان بـدرابزين معدني مغطى بألواح بلاستيكية واقية، يقعان داخل مساحة تجارية داخلية واسعة ومضيئة تتميز بجدران بيضاء وأرضيات خرسانية، مع ظهور نوافذ كبيرة في الخلفية.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.1.caption": "مشهد داخلي للمركز التجاري يُظهر سلالم منحنية أثناء مرحلة التشطيب.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.2.alt": "تستقر نافذة سقفية زجاجية عصرية هرمية الشكل - ذات إطار داكن وألواح زجاجية مائلة للون الأخضر - فوق سقف مكسو ببلاط بني فاتح. وفي الخلفية، تظهر عدة مبانٍ سكنية متعددة الطوابق تحت سماء تتخللها بعض السحب.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.2.caption": "تفصيلة معمارية لمنور سقف في المركز التجاري.",
