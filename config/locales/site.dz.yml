      "projectContent.said-hamdine-mixed-real-estate.faq.0.question": "ما هو المجمع العقاري متعدد الاستخدامات الذي يضم 202 وحدة سكنية ترويجية مجانية؟",
      "projectContent.said-hamdine-mixed-real-estate.faq.0.answer": "يقع مجمع عقاري متعدد الاستخدامات، يضم 202 وحدة سكنية ترويجية حرة، في منطقة سعيد حمدين ببلدية بئر مراد رايس في الجزائر العاصمة.",
      "projectContent.said-hamdine-mixed-real-estate.faq.1.question": "ما هو نطاق المشروع؟",
      "projectContent.said-hamdine-mixed-real-estate.faq.1.answer": "مجمع سكني عالي الكثافة ومتعدد الاستخدامات يجمع بين مبانٍ سكنية ومواقف سيارات تحت الأرض وأعمال دعم إنشائي متكاملة. يضم المشروع خمسة مبانٍ توفر وحدات سكنية ومستويين لمواقف السيارات تحت الأرض.",
      "projectContent.said-hamdine-mixed-real-estate.faq.2.question": "ما الذي يجعل المشروع مميزاً؟",
      "projectContent.said-hamdine-mixed-real-estate.faq.2.answer": "أعمال الإنشاءات (بما في ذلك كافة المرافق والخدمات التابعة) لمجمع عقاري متعدد الاستخدامات يضم 5 مبانٍ، و202 وحدة سكنية ترويجية (سوق حر)، وطابقين لمواقف السيارات تحت الأرض. تسليم مجمع عقاري متعدد الاستخدامات مكون من خمسة مبانٍ سكنية وطابقين لمواقف السيارات تحت الأرض.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.0.alt": "مشهد علوي لبلاطة خرسانية مسلحة بقضبان الحديد، يُظهر عمال البناء ومضخة خرسانة ومباني سكنية في الخلفية وقت الغروب.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.0.caption": "تركيب قضبان التسليح في موقع بناء عند الغروب.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.1.alt": "لقطة من زاوية منخفضة لمبنيين شاهقين وعصريين يتميزان بوجود شرفات، وواجهات تجمع بين الألوان الأبيض والبيج والرمادي، وطابق أرضي من الزجاج العاكس.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.1.caption": "حياة حضرية عصرية بتصميم أنيق.",
      "projectContent.said-hamdine-mixed-real-estate.images.intro.alt": "عمال بناء في موقع عمل عند الغروب، يجهزون بلاطة خرسانية تحتوي على شبكة كثيفة من قضبان التسليح، مع وجود مضخة خرسانة في الخلفية.",
      "projectContent.said-hamdine-mixed-real-estate.images.intro.caption": "تركيب قضبان التسليح في موقع بناء عند الغروب.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.0.alt": "لقطة علوية لموقع بناء تُظهر حفرة كبيرة ذات أرضية خرسانية؛ حيث يقوم عدد كبير من العمال -الذين يرتدون سترات السلامة البرتقالية- بوضع وربط شبكات حديد التسليح الخاصة بأساسات المبنى بدقة وعناية. وتظهر في الخلفية الجدران الترابية للحفرة، وهي شديدة الانحدار ومُدعّمة لضمان استقرارها.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.0.caption": "تجري حالياً أعمال الأساسات، بما في ذلك تركيب حديد التسليح.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.1.alt": "شرفة عصرية ونظيفة تتميز بأرضية من البلاط بمظهر خشبي، ودرابزين زجاجي، وطاولة مستديرة صغيرة، وثلاثة كراسي داكنة اللون. وتظهر في الخلفية مبانٍ سكنية أخرى.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.1.caption": "استمتع بالحياة في الهواء الطلق على هذه الشرفة الأنيقة.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.2.alt": "منظور سفلي لمبنى سكني شاهق وعصري، يتميز بشرفات ذات درابزين زجاجي وطابق أرضي تجاري بواجهة زجاجية عاكسة، وذلك على خلفية سماء زرقاء صافية يظهر فيها قمر باهت، بينما تؤطر شجرة خضراء الجانب الأيمن جزئياً.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.2.caption": "واجهة مبنى معاصر متعدد الاستخدامات عند الغسق أو الفجر.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.3.alt": "مشهد علوي لبلاطة خرسانية مسلحة بقضبان الحديد، يُظهر عمال البناء ومضخة خرسانة ومباني سكنية في الخلفية وقت الغروب.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.3.caption": "تركيب قضبان التسليح في موقع بناء عند الغروب.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.0.alt": "عمال بناء يرتدون سترات السلامة يقومون بتركيب قضبان التسليح الفولاذية لأساس مبنى ضخم داخل حفرة عميقة، مع ظهور الجدران الاستنادية.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.0.caption": "تجري حالياً أعمال الأساسات، بما في ذلك تركيب حديد التسليح.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.1.alt": "مشهد لردهة نظيفة وخالية، تتميز بجدران بيضاء وأرضية من البلاط اللامع باللون البني الداكن، وتضم عدة أبواب مفتوحة تؤدي إلى غرف أخرى، بما في ذلك منطقة لتناول الطعام وغرفة نوم.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.1.caption": "ممر واسع وعصري يربط بين غرف مختلفة.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.2.alt": "لقطة علوية لموقع بناء تُظهر حفرة كبيرة ذات أرضية خرسانية؛ حيث يقوم عدد كبير من العمال -الذين يرتدون سترات السلامة البرتقالية- بوضع وربط شبكات حديد التسليح الخاصة بأساسات المبنى بدقة وعناية. وتظهر في الخلفية الجدران الترابية للحفرة، وهي شديدة الانحدار ومُدعّمة لضمان استقرارها.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.2.caption": "تجري حالياً أعمال الأساسات، بما في ذلك تركيب حديد التسليح.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.3.alt": "شرفة عصرية ونظيفة تتميز بأرضية من البلاط بمظهر خشبي، ودرابزين زجاجي، وطاولة مستديرة صغيرة، وثلاثة كراسي داكنة اللون. وتظهر في الخلفية مبانٍ سكنية أخرى.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.3.caption": "استمتع بالحياة في الهواء الطلق على هذه الشرفة الأنيقة.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.0.alt": "مبنى متعدد الطوابق قيد الإنشاء، تظهر فيه بلاطات خرسانية وأعمدة وجدران من الطوب الأحمر. وتمتد على جانب المبنى أنابيب صفراء مخصصة لتصريف الأنقاض، كما تظهر مواد البناء في الطوابق السفلية، وتوجد رافعة في الخلفية.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.0.caption": "سير العمل في مشروع تطوير \"سيدي يحيى\"، مع تسليط الضوء على الأعمال الإنشائية.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.1.alt": "مبنى شاهق قيد الإنشاء، يبرز فيه هيكل خرساني وجدران من الطوب الأحمر لم تكتمل بعد ومزلقانات صفراء للتخلص من الأنقاض، وذلك على خلفية سماء ملبدة بالغيوم.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.1.caption": "مبنى متعدد الطوابق قيد الإنشاء، بهيكل خرساني وأعمال بناء بالطوب.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.2.alt": "لقطة علوية لموقع بناء تُظهر حفرة كبيرة ذات أرضية خرسانية؛ حيث يقوم عدد كبير من العمال -الذين يرتدون سترات السلامة البرتقالية- بوضع وربط شبكات حديد التسليح الخاصة بأساسات المبنى بدقة وعناية. وتظهر في الخلفية الجدران الترابية للحفرة، وهي شديدة الانحدار ومُدعّمة لضمان استقرارها.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.2.caption": "تجري حالياً أعمال الأساسات، بما في ذلك تركيب حديد التسليح.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.3.alt": "عمال بناء يرتدون سترات السلامة يقومون بتركيب قضبان التسليح الفولاذية لأساس مبنى ضخم داخل حفرة عميقة، مع ظهور الجدران الاستنادية.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.3.caption": "تجري حالياً أعمال الأساسات، بما في ذلك تركيب حديد التسليح.",
      "projectContent.said-hamdine-mixed-real-estate.images.featured.0.alt": "مشهد علوي لبلاطة خرسانية مسلحة بقضبان الحديد، يُظهر عمال البناء ومضخة خرسانة ومباني سكنية في الخلفية وقت الغروب.",
      "projectContent.said-hamdine-mixed-real-estate.images.featured.0.caption": "تركيب قضبان التسليح في موقع بناء عند الغروب.",
