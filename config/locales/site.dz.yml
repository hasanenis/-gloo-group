      "projectContent.bas-mazagran-200-38-housing.faq.0.question": "ما المقصود بـ 200 وحدة سكنية مدعومة و38 وحدة سكنية ترويجية مجانية؟",
      "projectContent.bas-mazagran-200-38-housing.faq.0.answer": "يقع المشروع في منطقة \"باس مازاغران\" بولاية مستغانم في الجزائر، ويضم 200 وحدة سكنية مدعومة و38 وحدة سكنية ترويجية (حرة)، بالإضافة إلى محلات تجارية.",
      "projectContent.bas-mazagran-200-38-housing.faq.1.question": "ما هو نطاق المشروع؟",
      "projectContent.bas-mazagran-200-38-housing.faq.1.answer": "برنامج سكني متكامل يوازن بين الوحدات المدعومة والوحدات المتاحة بأسعار السوق، إلى جانب الاستخدامات التجارية المصاحبة؛ ويشمل البرنامج وحدات سكنية ومساحات تجارية وطرقاً وشبكات خدمية.",
      "projectContent.bas-mazagran-200-38-housing.faq.2.question": "Who led the التسليم?",
      "projectContent.bas-mazagran-200-38-housing.faq.2.answer": "الزبون: OPGI.",
      "projectContent.bas-mazagran-200-38-housing.faq.3.question": "ما الذي يجعل المشروع مميزاً؟",
      "projectContent.bas-mazagran-200-38-housing.faq.3.answer": "إنجاز 200 وحدة سكنية ترويجية مدعومة و38 وحدة سكنية ترويجية حرة، مع محلات تجارية وطرق وشبكات في منطقة \"باس مزغران\" (Bas Mazagran). يشمل المشروع وحدات سكنية ومحلات تجارية وطرقاً وشبكات خدمية ضمن برنامج عمراني مختلط.",
      "projectContent.bas-mazagran-200-38-housing.images.hero.0.alt": "مشهد لعدة مبانٍ سكنية متعددة الطوابق قيد الإنشاء، تظهر فيها الهياكل الخرسانية وجدران الحشو من الطوب الأحمر، مع سماء زرقاء صافية في الخلفية وشخص يسير في المقدمة.",
      "projectContent.bas-mazagran-200-38-housing.images.hero.0.caption": "تقدم العمل في الوحدات السكنية في \"باس مازاغران\".",
      "projectContent.bas-mazagran-200-38-housing.images.hero.1.alt": "لقطة واسعة لموقع بناء يضم عدة هياكل سكنية خرسانية في مراحل متفاوتة من الإنجاز، حيث تبرز قضبان التسليح من قممها، وتظهر رافعة برجية زرقاء كبيرة على اليسار مقابل سماء زرقاء صافية. وتتوزع مواد البناء على الأرضية الترابية.",
      "projectContent.bas-mazagran-200-38-housing.images.hero.1.caption": "تقدم أعمال البناء في الوحدات السكنية باستخدام رافعة برجية.",
      "projectContent.bas-mazagran-200-38-housing.images.intro.alt": "مشهد لموقع بناء تظهر فيه أكوام كبيرة من التربة البنية في المقدمة، ورافعتان قيد التشغيل (إحداهما برجية والأخرى متحركة)، ومبانٍ قيد الإنشاء في الخلفية تحت سماء ملبدة بالغيوم.",
      "projectContent.bas-mazagran-200-38-housing.images.intro.caption": "أعمال ترابية ورافعات في موقع إنشاء مشروع سكني.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.0.alt": "لقطة جوية لموقع بناء تظهر حفارة كبيرة رمادية اللون من طراز \"HIDROMEK\" وهي تعمل في حفرة واسعة ذات أرضية رملية. وتوجد شاحنتا قلاب برتقاليتان متوقفتان بالجوار، إحداهما محملة بالأتربة. وفي الخلفية، يظهر مبنى خرساني قيد الإنشاء، إلى جانب مبانٍ سكنية وتلال بعيدة، كما يتواجد عاملان في موقع البناء بالقرب من الشاحنات.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.0.caption": "تجري أعمال الحفر والتهيئة في مشروع \"باس مازاغران\" السكني.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.1.alt": "تقوم حفارة ذات مغرفة كبيرة بحفر خندق عميق في تربة رملية. ويقف عاملان في مجال البناء بالقرب من الخندق لمراقبة العملية، بينما يظهر عامل آخر داخل مقصورة الحفارة. وتوجد في الخلفية جدار خرساني يعلوه سياج من الأسلاك الشائكة.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.1.caption": "أعمال ترابية جارية بوجود حفارة وعمال في الموقع.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.2.alt": "عاملان بالقرب من شاحنة صغيرة بيضاء محملة بمواد البناء في موقع ترابي، مع وجود رافعة برجية زرقاء كبيرة ومبانٍ متعددة الطوابق قيد الإنشاء في الخلفية، تحت سماء غائمة جزئياً.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.2.caption": "توريد المواد وأعمال البناء الجارية في موقع \"باس مازاغران\".",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.3.alt": "مشهد لعدة مبانٍ سكنية متعددة الطوابق قيد الإنشاء، تظهر فيها الهياكل الخرسانية وجدران الحشو من الطوب الأحمر، مع سماء زرقاء صافية في الخلفية وشخص يسير في المقدمة.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.3.caption": "تقدم العمل في الوحدات السكنية في \"باس مازاغران\".",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.0.alt": "حفارة وشاحنتان قلابتان في موقع بناء رملي، مع مبنى خرساني قيد الإنشاء جزئياً في الخلفية تحت سماء ملبدة بالغيوم.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.0.caption": "تجري أعمال الحفر في مشروع \"باس مازاغران\" السكني.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.1.alt": "حفارة وشاحنات قلابة في موقع بناء يضم حفرة عميقة ومبنى خرسانياً قيد الإنشاء جزئياً، وذلك تحت سماء ملبدة بالغيوم.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.1.caption": "أعمال الحفر والإنشاءات الأولية في مشروع \"باس مازاغران\" السكني.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.2.alt": "مشهد لعدة مبانٍ سكنية متعددة الطوابق قيد الإنشاء، تظهر فيها الهياكل الخرسانية وجدران الحشو من الطوب الأحمر، مع سماء زرقاء صافية في الخلفية وشخص يسير في المقدمة.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.2.caption": "تقدم العمل في الوحدات السكنية في \"باس مازاغران\".",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.3.alt": "لقطة واسعة لموقع بناء يضم عدة هياكل سكنية خرسانية في مراحل متفاوتة من الإنجاز، حيث تبرز قضبان التسليح من قممها، وتظهر رافعة برجية زرقاء كبيرة على اليسار مقابل سماء زرقاء صافية. وتتوزع مواد البناء على الأرضية الترابية.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.3.caption": "تقدم أعمال البناء في الوحدات السكنية باستخدام رافعة برجية.",
