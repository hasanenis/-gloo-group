      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.3.caption": "تصميم داخلي عصري لمركز تجاري يضم سلماً متعدد المستويات.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.0.alt": "تستقر نافذة سقفية زجاجية عصرية هرمية الشكل - ذات إطار داكن وألواح زجاجية مائلة للون الأخضر - فوق سقف مكسو ببلاط بني فاتح. وفي الخلفية، تظهر عدة مبانٍ سكنية متعددة الطوابق تحت سماء تتخللها بعض السحب.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.0.caption": "تفصيلة معمارية لمنور سقف في المركز التجاري.",
