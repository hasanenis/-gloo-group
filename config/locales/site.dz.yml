      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.0.caption": "أعمال الحفر جارية في مشروع \"باس مازاغران\" السكني.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.1.alt": "شاحنة صغيرة بيضاء من طراز JMC محملة بأكياس من مواد البناء، ويقف رجلان بالقرب منها في موقع بناء ذي أرضية ترابية. وفي الخلفية، تظهر رافعة برجية زرقاء كبيرة وعدة مبانٍ متعددة الطوابق قيد الإنشاء تحت سماء تتخللها بعض السحب.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.1.caption": "توريد المواد وأعمال البناء الجارية في مشروع \"باس مازاغران\" السكني.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.2.alt": "مشهد لعدة مبانٍ سكنية متعددة الطوابق قيد الإنشاء، تظهر فيها الهياكل الخرسانية وجدران الحشو من الطوب الأحمر، مع سماء زرقاء صافية في الخلفية وشخص يسير في المقدمة.",
