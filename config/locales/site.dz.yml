      "projectContent.sidi-benour-50-housing.faq.0.question": "ما المقصود بـ 50 وحدة سكنية ترويجية مجانية؟",
      "projectContent.sidi-benour-50-housing.faq.0.answer": "يقع مشروع يضم 50 وحدة سكنية ترويجية في سيدي بنور، الجزائر العاصمة؛ وهي وحدات سكنية ترويجية تُباع بأسعار السوق (LPL).",
      "projectContent.sidi-benour-50-housing.faq.1.question": "ما هو نطاق المشروع؟",
      "projectContent.sidi-benour-50-housing.faq.1.answer": "حزمة تنفيذ إنشائي تركز على أعمال البناء الأساسية لبرنامج إسكان ترويجي مجاني؛ وتشمل أعمالاً إنشائية سكنية يتم تنفيذها في الموقع على مراحل.",
      "projectContent.sidi-benour-50-housing.faq.2.question": "ما الذي يجعل المشروع مميزاً؟",
      "projectContent.sidi-benour-50-housing.faq.2.answer": "أعمال هيكلية لـ 50 وحدة سكنية ترويجية (سكن حر) في سيدي بنور، الجزائر العاصمة؛ وتشمل الأعمال الهيكلية السكنية التنفيذ المرحلي في الموقع.",
      "projectContent.sidi-benour-50-housing.images.hero.0.alt": "مشهد خارجي لمبنى سكني متعدد الطوابق قيد الإنشاء، يظهر فيه الهيكل الخرساني المكشوف وجدران الحشو من الطوب الأحمر، تحت سماء ملبدة بالغيوم.",
      "projectContent.sidi-benour-50-housing.images.hero.0.caption": "مبنى سكني قيد الإنشاء مع حشوات من الطوب.",
      "projectContent.sidi-benour-50-housing.images.hero.1.alt": "مشهد لمبنى سكني متعدد الطوابق قيد الإنشاء، يضم جدرانًا خرسانية استنادية ضخمة وهياكل معقدة من قضبان التسليح، مع وجود عمال في الطابق العلوي، وذراع رافعة تعلو الموقع، ومبانٍ أخرى تظهر في الخلفية.",
      "projectContent.sidi-benour-50-housing.images.hero.1.caption": "تقدم في الأعمال الإنشائية للوحدات السكنية في سيدي بنور.",
      "projectContent.sidi-benour-50-housing.images.intro.alt": "مبنى سكني شاهق قيد الإنشاء، يبرز فيه هيكل خرساني مكشوف وجدران حشو من الطوب الأحمر، بالإضافة إلى رافعة برجية حمراء تظهر على خلفية سماء زرقاء صافية؛ كما تظهر أكوام من الطوب الأحمر على الأرض في المقدمة.",
      "projectContent.sidi-benour-50-housing.images.intro.caption": "تقدم في الأعمال الإنشائية للوحدات السكنية الخمسين في سيدي بنور.",
      "projectContent.sidi-benour-50-housing.images.mosaic.0.alt": "تُشرف رافعة برجية ضخمة على مبنى خرساني متعدد الطوابق قيد الإنشاء، تظهر فيه قضبان التسليح والسقالات في الطوابق العليا، وذلك تحت سماء ملبدة بالغيوم.",
      "projectContent.sidi-benour-50-housing.images.mosaic.0.caption": "تجري الأعمال الإنشائية للوحدات السكنية.",
      "projectContent.sidi-benour-50-housing.images.mosaic.1.alt": "مشهد خارجي كامل لمبنى سكني شاهق وعصري فاتح اللون، يضم العديد من الشرفات والنوافذ، ويُرى من مستوى الأرض من خلف جدار خرساني منخفض ومساحة مبلطة.",
      "projectContent.sidi-benour-50-housing.images.mosaic.1.caption": "مبنى سكني مُنجَز في سيدي بنور، الجزائر العاصمة.",
      "projectContent.sidi-benour-50-housing.images.mosaic.2.alt": "مبنى سكني شاهق قيد الإنشاء، تظهر فيه الأعمدة والأسقف الخرسانية وجدران من الطوب الأحمر وشرفات. وتظهر جزئياً رافعة بناء حمراء كبيرة على الجانب الأيسر وهي تمتد نحو الأعلى، كما يظهر عامل على إحدى الشرفات العلوية.",
      "projectContent.sidi-benour-50-housing.images.mosaic.2.caption": "تتواصل الأعمال الإنشائية وأعمال بناء الجدران (الطوب) في الوحدات السكنية.",
      "projectContent.sidi-benour-50-housing.images.mosaic.3.alt": "مشهد خارجي لمبنى سكني متعدد الطوابق قيد الإنشاء، يظهر فيه الهيكل الخرساني المكشوف وجدران الحشو من الطوب الأحمر، تحت سماء ملبدة بالغيوم.",
      "projectContent.sidi-benour-50-housing.images.mosaic.3.caption": "مبنى سكني قيد الإنشاء مع حشوات من الطوب.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.0.alt": "لقطة جوية لموقع بناء يضم أساساً خرسانياً ضخماً وهياكل من حديد التسليح لطابق جديد، مع رافعة برجية حمراء على اليسار وعمال يتواجدون فوق الهيكل الإنشائي. وتظهر في الخلفية مبانٍ سكنية وتلال خضراء تحت سماء يغشاها الضباب.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.0.caption": "أعمال إنشائية جارية للوحدات السكنية، تشمل حديد التسليح والقوالب الخرسانية.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.1.alt": "يقف عامل بناء يرتدي قميصاً مخططاً وقبعة بين أكوام كبيرة من الطوب الأحمر المفرغ داخل مبنى قيد الإنشاء، حيث تظهر مبانٍ سكنية ومساحات خضراء في الأفق عبر جزء مفتوح.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.1.caption": "عامل يحمل طوباً في موقع سكني بسيدي بنور.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.2.alt": "مبنى سكني شاهق قيد الإنشاء، يبرز فيه هيكل خرساني مكشوف وجدران حشو من الطوب الأحمر، بالإضافة إلى رافعة برجية حمراء تظهر على خلفية سماء زرقاء صافية؛ كما تظهر أكوام من الطوب الأحمر على الأرض في المقدمة.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.2.caption": "تقدم في الأعمال الإنشائية للوحدات السكنية الخمسين في سيدي بنور.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.3.alt": "مشهد خارجي لمبنى سكني متعدد الطوابق قيد الإنشاء، يظهر فيه الهيكل الخرساني المكشوف وجدران الحشو من الطوب الأحمر، تحت سماء ملبدة بالغيوم.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.3.caption": "مبنى سكني قيد الإنشاء مع حشوات من الطوب.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.0.alt": "مبنى سكني شاهق قيد الإنشاء، تظهر فيه طوابق متعددة بهياكل خرسانية مكشوفة وبعض أعمال البناء بالطوب الأحمر. تظهر رافعة برجية كبيرة في الزاوية العلوية اليسرى، والسماء رمادية وملبدة بالغيوم، كما تبدو مواد البناء موجودة على بعض الشرفات.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.0.caption": "تقدم في الأعمال الإنشائية للوحدات السكنية الخمسين في سيدي بنور.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.1.alt": "لقطة من زاوية منخفضة لمبنى خرساني متعدد الطوابق قيد الإنشاء، تُظهر ألواحاً خرسانية مكشوفة وأعمدة وسقالات خشبية في الطوابق العليا. تظهر ذراع رافعة في الزاوية اليمنى العلوية، بينما تسطع الشمس بقوة من خلف المبنى، مما يخلق تأثيراً ظلياً (صورة ظلية) أمام سماء زرقاء تتخللها بعض السحب.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.1.caption": "هيكل خرساني يرتفع نحو السماء.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.2.alt": "مبنى سكني شاهق قيد الإنشاء، يبرز فيه هيكل خرساني مكشوف وجدران حشو من الطوب الأحمر، بالإضافة إلى رافعة برجية حمراء تظهر على خلفية سماء زرقاء صافية؛ كما تظهر أكوام من الطوب الأحمر على الأرض في المقدمة.",
