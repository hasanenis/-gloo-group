      "projectContent.bas-mazagran-200-38-housing.title": "200 وحدة سكنية مدعومة و38 وحدة سكنية ترويجية مجانية",
      "projectContent.bas-mazagran-200-38-housing.eyebrow": "استعمال مختلط مشروع",
      "projectContent.bas-mazagran-200-38-housing.summary.0": "يُعد مشروع \"200 وحدة سكنية مدعومة و38 وحدة سكنية ترويجية حرة\" مشروعاً متعدد الاستخدامات، ويقع في منطقة \"باس مزغران\" بولاية مستغانم في الجزائر.",
      "projectContent.bas-mazagran-200-38-housing.summary.1": "الزبون: OPGI.",
      "projectContent.bas-mazagran-200-38-housing.description.0": "إنجاز 200 وحدة سكنية ترقوية مدعمة و38 وحدة سكنية ترقوية حرة، مع محلات تجارية وطرق وشبكات في \"باس مزغران\".",
      "projectContent.bas-mazagran-200-38-housing.description.1": "برنامج سكني متكامل يوازن بين الوحدات المدعومة والوحدات المتاحة بأسعار السوق، إلى جانب الاستخدامات التجارية المصاحبة. النطاق: يشمل الوحدات السكنية، والمساحات التجارية، والطرق، وشبكات الخدمات لهذا البرنامج متعدد الاستخدامات.",
      "projectContent.bas-mazagran-200-38-housing.authority": "تتولى شركة \"Igloo Construction\" تنسيق عمليات التسليم بالدقة والاحترافية اللازمتين لمشاريع تجمع بين الوحدات السكنية والمحلات التجارية؛ حيث تشمل الأعمال توفير الوحدات السكنية والمساحات التجارية والطرق وشبكات الخدمات ضمن مشروع متعدد الاستخدامات.",
      "projectContent.bas-mazagran-200-38-housing.seo": "اطلع على معرض الصور والتفاصيل الفنية ومعلومات الموقع الخاصة بـ 200 وحدة سكنية مدعومة و38 وحدة سكنية ترويجية حرة. يجسد المشروع نموذجاً لتنفيذ مشاريع سكنية ومتعددة الاستخدامات تقودها الجهة المطورة.",
