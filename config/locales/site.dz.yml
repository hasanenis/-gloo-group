      "projectContent.said-hamdine-mixed-real-estate.title": "مجمع عقاري متعدد الاستخدامات يضم 202 وحدة سكنية ترويجية حرة",
      "projectContent.said-hamdine-mixed-real-estate.eyebrow": "استعمال مختلط مشروع",
      "projectContent.said-hamdine-mixed-real-estate.summary.0": "يُعد المجمع العقاري المتكامل، الذي يضم 202 وحدة سكنية ترويجية حرة، مشروعاً متعدد الاستخدامات؛ وهو يقع في منطقة سعيد حمدين ببلدية بئر مراد رايس في الجزائر العاصمة.",
      "projectContent.said-hamdine-mixed-real-estate.summary.1": "مجمع سكني عالي الكثافة ومتعدد الاستخدامات يجمع بين كتل سكنية، ومواقف سيارات تحت الأرض، وأعمال دعم إنشائي منسقة.",
      "projectContent.said-hamdine-mixed-real-estate.description.0": "أعمال البناء والتشطيبات لمجمع عقاري متعدد الاستخدامات يضم 5 مبانٍ، و202 وحدة سكنية ترويجية (سوق حر)، وطابقين سفليين لمواقف السيارات. البرنامج: مجمع عقاري متعدد الاستخدامات.",
      "projectContent.said-hamdine-mixed-real-estate.description.1": "مجمع سكني عالي الكثافة ومتعدد الاستخدامات يجمع بين مبانٍ سكنية ومواقف سيارات تحت الأرض وأعمال دعم إنشائي متكاملة. نطاق العمل: تنفيذ مشروع عقاري متعدد الاستخدامات يضم خمسة مبانٍ سكنية ومستويين لمواقف السيارات تحت الأرض.",
      "projectContent.said-hamdine-mixed-real-estate.authority": "تتولى شركة \"Igloo Construction\" تنسيق عملية التسليم بالدقة والاحترافية اللازمتين لمشروع عقاري متعدد الاستخدامات؛ ويشمل المشروع تسليم مجمع عقاري مكون من خمسة مبانٍ تجمع بين الوحدات السكنية ومستويين لمواقف السيارات تحت الأرض.",
      "projectContent.said-hamdine-mixed-real-estate.seo": "اطلع على معرض الصور والتفاصيل الفنية ومعلومات الموقع الخاصة بالمجمع العقاري متعدد الاستخدامات، الذي يضم 200 وحدة سكنية ترويجية حرة. يجسد المشروع نموذجاً لتنفيذ المشاريع السكنية ومتعددة الاستخدامات بقيادة الجهة المطورة.",
      "projectContent.said-hamdine-mixed-real-estate.meta.0.label": "نوع المشروع",
