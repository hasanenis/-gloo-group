      "projectContent.staoueli-11-41-villas.title": "11/41 فيلات and Network Works",
      "projectContent.staoueli-11-41-villas.eyebrow": "سكني مشروع",
      "projectContent.staoueli-11-41-villas.summary.0": "مشروع \"11/41 للفيلات وأعمال الشبكات\" هو مشروع سكني يقع في سطاوالي، الجزائر العاصمة، الجزائر.",
      "projectContent.staoueli-11-41-villas.summary.1": "يجمع البرنامج بين حزم إنشاء الفلل وأعمال الطرق وشبكات المرافق اللازمة لضمان الجاهزية الكاملة للموقع.",
      "projectContent.staoueli-11-41-villas.description.0": "أعمال الإنشاءات الخاصة بجميع المرافق الثانوية، بما في ذلك مختلف أعمال الطرق والشبكات لمشروع الفيلات (11/41) في سطاوالي. البرنامج: فيلات ترويجية حرة.",
      "projectContent.staoueli-11-41-villas.description.1": "يجمع البرنامج بين حزم إنشاء الفيلات وأعمال الطرق وشبكات المرافق اللازمة لضمان الجاهزية الكاملة للموقع. نطاق العمل: فيلات سكنية، بالإضافة إلى الطرق وشبكات المرافق والبنية التحتية المتكاملة للموقع.",
      "projectContent.staoueli-11-41-villas.authority": "تتولى شركة \"Igloo Construction\" تنسيق عمليات التسليم بالدقة والاحترافية اللازمة لمشاريع الفلل السكنية المستقلة، والتي تشمل الفلل إلى جانب الطرق وشبكات المرافق والبنية التحتية المتكاملة للموقع.",
      "projectContent.staoueli-11-41-villas.seo": "اطّلع على معرض الصور والتفاصيل التقنية ومعلومات الموقع لمشروع 11/41 فيلا وأشغال الشبكات، الذي يجمع تنفيذ السكن والتهيئة الخارجية ضمن برنامج واحد.",
      "projectContent.staoueli-11-41-villas.meta.0.label": "نوع المشروع",
