      "projectContent.boudouaou-70-10-housing.title": "Projet de 70 Logements Promotionnels Aidés (LPA) et 10 Logements Promotionnels Libres (LPL) avec locaux commerciaux et professionnels – Boudouaou, Boumerdès",
      "projectContent.boudouaou-70-10-housing.eyebrow": "PROJET MIXTE",
      "projectContent.boudouaou-70-10-housing.summary.0": "Ce projet mixte comprend 70 Logements Promotionnels Aidés (LPA) et 10 Logements Promotionnels Libres (LPL), accompagnés de 10 locaux commerciaux et professionnels. Il est situé à Boudouaou, Boumerdès, en Algérie.",
      "projectContent.boudouaou-70-10-housing.summary.1": "Client : AADL.",
      "projectContent.boudouaou-70-10-housing.description.0": "À Boudouaou, ce programme réunit 70 logements LPA, 10 logements LPL, des locaux professionnels et commerciaux, ainsi que les travaux de VRD.",
      "projectContent.boudouaou-70-10-housing.description.1": "Le projet se distingue par la combinaison harmonieuse de logements promotionnels aidés et libres au sein d’un même ensemble résidentiel. La présence de locaux commerciaux et professionnels favorise la création d’un environnement de proximité répondant aux besoins quotidiens des habitants. Réparti sur trois blocs de hauteurs variées (R+8 et R+5), le projet offre une organisation équilibrée des espaces et une meilleure intégration urbaine. Les travaux de viabilisation et les réseaux d'accompagnement renforcent la qualité des infrastructures, tandis que la diversité des logements F3 et F4 permet de répondre aux attentes de diverses catégories de familles, offrant un cadre de vie moderne et fonctionnel.",
      "projectContent.boudouaou-70-10-housing.authority": "Igloo Construction coordonne les logements, les locaux professionnels et commerciaux, ainsi que les travaux de VRD dans une même organisation de chantier.",
