      "projectContent.staoueli-11-41-villas.facilityGroups.0.items.2": "Offrir des habitations de standing dans un cadre résidentiel moderne, confortable et sécurisé",
      "projectContent.staoueli-11-41-villas.faq.0.question": "En quoi consiste le projet des 11/41 villas à Staouéli ?",
      "projectContent.staoueli-11-41-villas.faq.0.answer": "La réalisation des travaux en tous corps d'état secondaires, y compris les VRD, pour les 11/41 villas au lieu-dit Les Pastorales à Staouéli, se situe à Staouéli, Alger, Algérie. Il s'agit de villas promotionnelles libres.",
      "projectContent.staoueli-11-41-villas.faq.1.question": "Quel est le périmètre du projet ?",
      "projectContent.staoueli-11-41-villas.faq.1.answer": "Le programme intègre la construction de villas résidentielles et la réalisation de l'ensemble des infrastructures de voirie et réseaux divers (VRD) indispensables à l'opérationnalité complète du site. Il assure ainsi la livraison d'un ensemble résidentiel fonctionnel, incluant les réseaux d'utilité publique et les aménagements extérieurs coordonnés.",
      "projectContent.staoueli-11-41-villas.faq.2.question": "Qu’est-ce qui distingue le projet ?",
      "projectContent.staoueli-11-41-villas.faq.2.answer": "Le projet se distingue par la réalisation complète des 11/41 villas à Staoueli. Son caractère notable réside dans l'intégration de l'ensemble des travaux de construction et d'infrastructures, incluant la voirie, les réseaux divers (VRD) et les systèmes d'utilité publique, garantissant ainsi la pleine fonctionnalité et l'aménagement coordonné du site résidentiel.",
