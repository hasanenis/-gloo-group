      "projectContent.boudouaou-70-10-housing.title": "Réalisation en tous corps d’état secondaire des 70 logements promotionnels aider et 10 logements promotionnels libre avec 10 locaux a usage commercial et professionnel y compris les travaux de viabilisation reseaux tertiaries -Boudouaou -Boumerdes",
      "projectContent.boudouaou-70-10-housing.eyebrow": "PROJET MIXTE",
      "projectContent.boudouaou-70-10-housing.summary.0": "Réalisation en tous corps d’état secondaire des 70 logements promotionnels aider et 10 logements promotionnels libre avec 10 locaux a usage commercial et professionnel y compris les travaux de viabilisation reseaux tertiaries -Boudouaou -Boumerdes est un projet mixte. Localisation: Boudouaou -Boumerdes-Algerie.",
      "projectContent.boudouaou-70-10-housing.summary.1": "Client: AADL.",
      "projectContent.boudouaou-70-10-housing.description.0": "Réalisation de 70 logements promotionnels aidés et 10 logements promotionnels libres avec 10 locaux à usage professionnel et commercial, y compris les travaux de voirie et réseaux, à Boudouaou. Nature : Logements promotionnels aidés (LPA) et logements promotionnels libres (LPL) avec locaux commerciaux et professionnels.",
      "projectContent.boudouaou-70-10-housing.description.1": "Le projet se distingue par la combinaison harmonieuse de logements promotionnels aidés et libres au sein d’un même ensemble résidentiel. La présence de locaux commerciaux et professionnels favorise la création d’un environnement de proximité répondant aux besoins quotidiens des habitants. Réparti sur trois blocs de différentes hauteurs (R+8 et R+5), le projet offre une organisation équilibrée des espaces et une meilleure intégration urbaine. Les travaux de viabilisation et les réseaux tertiaires renforcent la qualité des infrastructures, tandis que la diversité des logements F3 et F4 permet de répondre aux attentes de plusieurs catégories de familles dans un cadre de vie moderne et fonctionnel.",
      "projectContent.boudouaou-70-10-housing.authority": "Igloo Construction coordonne la réalisation avec la rigueur nécessaire pour les logements promotionnels aidés (LPA) et les logements promotionnels libres (LPL) avec locaux commerciaux et professionnels. Logements, locaux professionnels, espaces commerciaux, voirie et réseaux.",
