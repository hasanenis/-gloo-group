      "projectContent.douira-commercial-centers-2500-housing.eyebrow": "PROJET MIXTE",
      "projectContent.douira-commercial-centers-2500-housing.summary.0": "Deux centres commerciaux réalisés à Douira, Alger, dans le cadre du programme résidentiel de 2 500 logements.",
      "projectContent.douira-commercial-centers-2500-housing.summary.1": "Un ensemble de commerces et de services conçu pour accompagner la vie quotidienne du quartier.",
      "projectContent.douira-commercial-centers-2500-housing.description.0": "Travaux de réalisation en corps d’état secondaire des deux centres commerciaux du programme résidentiel de 2 500 logements à Douira, Alger. Programme : centres commerciaux.",
      "projectContent.douira-commercial-centers-2500-housing.description.1": "Un ensemble de commerces et de services conçu pour accompagner la vie quotidienne du quartier. Le projet comprend deux centres commerciaux intégrant des espaces de vente, des services, des zones de circulation et l'ensemble des travaux de finition, le tout s'inscrivant dans un plan directeur d'aménagement résidentiel plus vaste.",
      "projectContent.douira-commercial-centers-2500-housing.authority": "Igloo Construction assure la coordination et la réalisation de ces centres commerciaux avec la rigueur requise. Le projet inclut deux centres commerciaux, avec leurs espaces de vente, de services, de circulation et l'ensemble des travaux de finition, intégrés au plan directeur d'aménagement résidentiel.",
      "projectContent.douira-commercial-centers-2500-housing.seo": "Découvrez la galerie photos, les détails techniques et les informations de localisation du projet Rahmania Commercial Centres. Ce projet illustre un modèle de développement résidentiel et mixte mené avec méthode.",
