      "projectContent.sidi-benour-50-housing.title": "Réalisation en TCE, y compris VRD, de 50 logements promotionnels libres (LPL) en R+13 à Sidi Benour, Mehelma, Alger",
      "projectContent.sidi-benour-50-housing.eyebrow": "PROJET RÉSIDENTIEL",
      "projectContent.sidi-benour-50-housing.summary.0": "Le projet résidentiel de 50 logements promotionnels libres (LPL) en R+13, incluant les travaux en TCE et VRD, est situé à Sidi Benour, Mehelma, Alger.",
      "projectContent.sidi-benour-50-housing.summary.1": "Le projet bénéficie d’un emplacement stratégique à Sidi Benour, Mehelma (Alger), offrant un cadre résidentiel attractif et un bon niveau d’accessibilité. Sa conception en immeuble de type R+13 permet une utilisation optimale de l’espace tout en proposant un habitat moderne et fonctionnel. L’intégration des travaux de VRD et des aménagements extérieurs contribue à la qualité de l’environnement urbain et au confort des futurs résidents. Ce projet se distingue également par son architecture résidentielle de grande hauteur, participant à la valorisation et au développement du secteur.",
      "projectContent.sidi-benour-50-housing.description.0": "Le projet concerne la réalisation des travaux de gros œuvre pour 50 logements promotionnels libres (LPL) à Sidi Benour, Alger.",
      "projectContent.sidi-benour-50-housing.description.1": "Le projet est stratégiquement implanté à Sidi Benour, Mehelma (Alger), offrant un cadre résidentiel attractif et une excellente accessibilité. Sa conception en immeuble de type R+13 optimise l'espace tout en proposant un habitat moderne et fonctionnel. L'intégration des travaux de VRD et des aménagements extérieurs contribue à la qualité de l'environnement urbain et au confort des futurs résidents. Cette architecture résidentielle de grande hauteur participe activement à la valorisation et au développement du secteur.",
      "projectContent.sidi-benour-50-housing.authority": "Igloo Construction assure la coordination de la réalisation avec la rigueur requise pour les logements promotionnels libres (LPL). Les travaux structurels résidentiels sont exécutés par phases sur site.",
      "projectContent.sidi-benour-50-housing.seo": "Découvrez la galerie, les détails techniques et les informations de localisation pour la réalisation en TCE, y compris VRD, de 50/362 logements promotionnels libres en R+13 à Sidi Benour, Mehelma, Alger. Ce projet illustre un modèle de réalisation résidentiel et mixte, mené avec rigueur.",
