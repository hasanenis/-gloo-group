      "projectContent.boudouaou-70-10-housing.facilityGroups.0.items.4": "Développer un ensemble résidentiel moderne intégrant habitat, commerces et services de proximité dans un cadre urbain fonctionnel.",
      "projectContent.boudouaou-70-10-housing.faq.0.question": "En quoi consiste le projet de 70 Logements Promotionnels Aidés (LPA) et 10 Logements Promotionnels Libres (LPL) ?",
      "projectContent.boudouaou-70-10-housing.faq.0.answer": "Le projet est situé à Boudouaou, dans la wilaya de Boumerdès, en Algérie. Il s'agit d'un ensemble de logements promotionnels aidés (LPA) et de logements promotionnels libres (LPL), complété par des locaux commerciaux et professionnels.",
      "projectContent.boudouaou-70-10-housing.faq.1.question": "Quel était le périmètre d'intervention du projet ?",
      "projectContent.boudouaou-70-10-housing.faq.1.answer": "Le projet se caractérise par un programme mixte, associant des logements promotionnels aidés et libres à des locaux commerciaux et professionnels, le tout intégré dans un ensemble cohérent. Il est réparti sur trois blocs de différentes hauteurs (R+8 et R+5), offrant une organisation équilibrée des espaces et une meilleure intégration urbaine. L'opération inclut également les travaux de viabilisation et la mise en place des réseaux tertiaires. La diversité des logements, comprenant des F3 et F4, répond aux attentes de différentes catégories de familles, dans un cadre de vie moderne et fonctionnel.",
      "projectContent.boudouaou-70-10-housing.faq.2.question": "Quel est le maître d'ouvrage ?",
      "projectContent.boudouaou-70-10-housing.faq.2.answer": "Client : AADL.",
      "projectContent.boudouaou-70-10-housing.faq.3.question": "Qu’est-ce qui distingue le projet ?",
      "projectContent.boudouaou-70-10-housing.faq.3.answer": "Le projet se distingue par la réalisation, à Boudouaou, de 70 logements promotionnels aidés (LPA) et de 10 logements promotionnels libres (LPL), complétés par 10 locaux professionnels et commerciaux, incluant les voiries et réseaux divers (VRD). Cette combinaison harmonieuse de logements au sein d’un même ensemble résidentiel, associée à la présence de locaux commerciaux et professionnels, favorise la création d’un environnement de proximité répondant aux besoins quotidiens des habitants. Réparti sur trois blocs de différentes hauteurs (R+8 et R+5), le projet offre une organisation équilibrée des espaces et une meilleure intégration urbaine. Les travaux de viabilisation et les réseaux renforcent la qualité des infrastructures, tandis que la diversité des logements F3 et F4 permet de répondre aux attentes de plusieurs catégories de familles dans un cadre de vie moderne et fonctionnel.",
