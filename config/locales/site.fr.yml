      "projectContent.staoueli-11-41-villas.authority": "Igloo Construction coordonne la réalisation avec la rigueur nécessaire pour les villas promotionnelles libres. Villas résidentielles plus voirie, réseaux et infrastructures de chantier coordonnées.",
