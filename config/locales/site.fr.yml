      "projectContent.dely-brahim-240-housing.title": "Réalisation des travaux en tous corps d’état secondaire avec VRD de 240 logements promotionnels libre avec surface commeriales et services ,Y/C parkings en sous sol Sis a Bois des cars ,Dely Brahim ,Alger",
      "projectContent.dely-brahim-240-housing.eyebrow": "PROJET MIXTE",
      "projectContent.dely-brahim-240-housing.summary.0": "Réalisation des travaux en tous corps d’état secondaire avec VRD de 240 logements promotionnels libre avec surface commeriales et services ,Y/C parkings en sous sol Sis a Bois des cars ,Dely Brahim ,Alger est un projet mixte. Localisation: Dely Brahim ,Alger ,Algerie.",
      "projectContent.dely-brahim-240-housing.summary.1": "Implanté à Bois des Cars, Dely Brahim, le projet bénéficie d’un emplacement privilégié offrant une excellente accessibilité et un environnement urbain de qualité. Sa conception verticale sur 33 étages permet d’optimiser l’occupation du terrain tout en proposant 240 logements de différentes typologies. La présence de commerces, de services et de parkings en sous-sol renforce l’autonomie et le confort des résidents. Les travaux de VRD et les installations techniques modernes garantissent une infrastructure performante, faisant de ce projet un ensemble résidentiel à forte valeur architecturale et fonctionnelle",
      "projectContent.dely-brahim-240-housing.description.0": "Travaux de réalisation en tous corps d'état secondaire avec voirie et réseaux pour 240 logements promotionnels libres avec surfaces commerciales, services et parking en sous-sol. Nature : Logements promotionnels libres avec surfaces commerciales et services.",
