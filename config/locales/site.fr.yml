      "projectContent.douaouda-300-500-housing.title": "Travaux de réalisation en TCE de 300/500 logements promotionnels aidés avec locaux à usage professionnel à Douaouda.",
      "projectContent.douaouda-300-500-housing.eyebrow": "PROJET MIXTE",
      "projectContent.douaouda-300-500-housing.summary.0": "Le projet de 300/500 Logements Promotionnels Aidés (LPA) avec locaux à usage professionnel à Douaouda est un programme mixte. Il est situé à Douaouda-Tipaza, en Algérie.",
      "projectContent.douaouda-300-500-housing.summary.1": "Client : AADL.",
      "projectContent.douaouda-300-500-housing.description.0": "Réalisation en Tous Corps d'État (TCE) du programme de 300/500 Logements Promotionnels Aidés (LPA) à Douaouda.",
      "projectContent.douaouda-300-500-housing.description.1": "Le projet bénéficie d’un emplacement stratégique à Douaouda (Tipaza), à proximité des axes principaux et offrant une belle ouverture sur la mer. Il se compose de bâtiments en R+8 abritant environ 300 à 500 logements de types F3 et F4, conçus pour offrir un cadre de vie agréable, aéré et moderne. L’intégration de locaux professionnels et d’espaces extérieurs aménagés renforce la fonctionnalité et la qualité de vie de l'ensemble.",
      "projectContent.douaouda-300-500-housing.authority": "Igloo Construction assure la coordination et la réalisation de ce programme de Logements Promotionnels Aidés (LPA) avec la rigueur requise. Le projet inclut la livraison des unités résidentielles, les travaux d'accompagnement coordonnés et l'aménagement des infrastructures du site.",
      "projectContent.douaouda-300-500-housing.seo": "Découvrez la galerie, les détails techniques et les informations de localisation du projet de 300/500 Logements Promotionnels Aidés (LPA) à Douaouda. Ce programme illustre un modèle de développement résidentiel et mixte mené avec expertise.",
