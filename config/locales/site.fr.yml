      "projectContent.bas-mazagran-200-38-housing.title": "200 Logements Promotionnels Aidés et 38 Logements Promotionnels Libres à Bas Mazagran, Mostaganem",
      "projectContent.bas-mazagran-200-38-housing.eyebrow": "PROJET MIXTE",
      "projectContent.bas-mazagran-200-38-housing.summary.0": "Ce projet mixte comprend 200 logements promotionnels aidés (LPA) et 38 logements promotionnels libres (LPL). Il est situé au pôle d’excellence de Bas Mazagran, Mostaganem, en Algérie.",
      "projectContent.bas-mazagran-200-38-housing.summary.1": "Client : OPGI",
      "projectContent.bas-mazagran-200-38-housing.description.0": "Le projet consiste en la réalisation de 200 logements promotionnels aidés et 38 logements promotionnels libres, intégrant des locaux commerciaux, ainsi que les voiries et réseaux divers (VRD) associés, à Bas Mazagran.",
      "projectContent.bas-mazagran-200-38-housing.description.1": "Ce projet comprend la réalisation de 7 blocs de logements promotionnels de type R+5 et R+9, avec des commerces en rez-de-chaussée. Il propose des logements F3 de 70,85 m² et F4 de 85 m², à raison de quatre logements par étage. La surface des blocs varie entre 385,90 m² et 420 m². Ce programme vise à offrir un cadre de vie moderne et confortable, tout en répondant aux besoins de proximité des résidents grâce aux espaces commerciaux intégrés.",
      "projectContent.bas-mazagran-200-38-housing.authority": "Igloo Construction coordonne les blocs de logements, les commerces et les travaux de VRD dans ce programme côtier de Bas Mazagran.",
