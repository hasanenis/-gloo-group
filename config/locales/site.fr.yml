      "projectContent.sidi-abdallah-200-1200-housing.title": "Réalisation de 200/1200 Logements Promotionnels Publics (LPP) à Sidi Abdellah (TCE secondaire, hors VRD) avec locaux commerciaux et professionnels",
      "projectContent.sidi-abdallah-200-1200-housing.eyebrow": "PROJET MIXTE",
      "projectContent.sidi-abdallah-200-1200-housing.summary.0": "Le projet de 200/1200 Logements Promotionnels Publics (LPP) à Sidi Abdellah est un ensemble mixte. Il intègre des logements ainsi que des locaux à usage commercial et professionnel. Sa réalisation a porté sur les corps d'état secondaires, hors VRD. Le site est localisé à Sidi Abdellah, Alger, Algérie.",
      "projectContent.sidi-abdallah-200-1200-housing.summary.1": "Le projet s'intègre harmonieusement au pôle urbain de Sidi Abdellah, un secteur en plein développement qui offre un cadre de vie moderne et attractif. Les bâtiments résidentiels, de type R+9, optimisent l'utilisation de l'espace tout en garantissant le confort des occupants. La diversité des logements, avec des F3 et F4, répond aux besoins de différentes catégories de familles. Parallèlement, les locaux commerciaux et professionnels dynamisent l'environnement et contribuent à la fonctionnalité de l'ensemble, favorisant ainsi la proximité des services et l'amélioration de la qualité de vie des résidents.",
      "projectContent.sidi-abdallah-200-1200-housing.description.0": "Ce projet concerne les travaux de construction de tous les corps d'état secondaires pour le programme de 200/1200 Logements Promotionnels Publics (LPP) à Sidi Abdellah - Mahalma.",
      "projectContent.sidi-abdallah-200-1200-housing.description.1": "Le projet s'intègre harmonieusement au pôle urbain de Sidi Abdellah, un secteur en plein développement qui offre un cadre de vie moderne et attractif. Les bâtiments résidentiels, de type R+9, optimisent l'utilisation de l'espace tout en garantissant le confort des occupants. La diversité des logements, avec des F3 et F4, répond aux besoins de différentes catégories de familles. Parallèlement, les locaux commerciaux et professionnels dynamisent l'environnement et contribuent à la fonctionnalité de l'ensemble, favorisant ainsi la proximité des services et l'amélioration de la qualité de vie des résidents.",
      "projectContent.sidi-abdallah-200-1200-housing.authority": "Igloo Construction coordonne la réalisation de ce programme de Logements Promotionnels Publics (LPP) avec la rigueur nécessaire, dans le cadre d'un projet de grande envergure intégrant des solutions constructives complètes.",
      "projectContent.sidi-abdallah-200-1200-housing.seo": "Explorez la galerie, les détails techniques et les notes de localisation du projet de 200/1200 Logements Promotionnels Publics (LPP) à Sidi Abdellah. Ce projet met en lumière un modèle de développement résidentiel et mixte.",
