      "projectContent.douaouda-300-500-housing.nearby.items.1": "Vues sur mer.",
      "projectContent.douaouda-300-500-housing.faq.0.question": "Qu’est-ce que le programme de 300/500 logements promotionnels aidés (LPA) ?",
      "projectContent.douaouda-300-500-housing.faq.0.answer": "Le programme de 300/500 logements promotionnels aidés (LPA) est situé à Douaouda, dans la wilaya de Tipaza, en Algérie. Il s'agit d'une opération de logements promotionnels aidés (LPA).",
      "projectContent.douaouda-300-500-housing.faq.1.question": "Quel est le périmètre du projet ?",
      "projectContent.douaouda-300-500-housing.faq.1.answer": "Le projet a consisté en la réalisation des travaux de gros œuvre et des aménagements complémentaires pour un vaste programme résidentiel soutenu par l'État. Il a notamment porté sur la construction de bâtiments en R+8, abritant entre 300 et 500 logements de types F3 et F4, ainsi que des locaux professionnels. Le périmètre incluait également la coordination des travaux d'accompagnement et la mise en place de l'infrastructure du site, le tout dans un cadre de vie moderne et aéré à Douaouda (Tipaza), avec une ouverture sur la mer.",
      "projectContent.douaouda-300-500-housing.faq.2.question": "Qui était le maître d'ouvrage ?",
      "projectContent.douaouda-300-500-housing.faq.2.answer": "Client : AADL.",
      "projectContent.douaouda-300-500-housing.faq.3.question": "Qu’est-ce qui distingue le projet ?",
      "projectContent.douaouda-300-500-housing.faq.3.answer": "Ce projet porte sur les travaux de construction des équipements publics secondaires intégrés au programme de 300 à 500 logements promotionnels aidés (LPA) à Douaouda. Il assure la livraison des unités résidentielles, des ouvrages d'accompagnement coordonnés et des infrastructures de site. Le projet bénéficie d’un emplacement stratégique à Douaouda (Tipaza), proche des axes principaux et offrant une belle ouverture sur la mer. Il comprend des bâtiments en R+8 proposant entre 300 et 500 logements de type F3 et F4, conçus pour un cadre de vie agréable, aéré et moderne. L’intégration de locaux professionnels et d’espaces extérieurs aménagés renforce la fonctionnalité et la qualité de vie au sein de cet ensemble.",
