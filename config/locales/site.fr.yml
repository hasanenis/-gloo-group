      "projectContent.douira-commercial-centers-2500-housing.facilityGroups.0.items.1": "Mettre à disposition des espaces commerciaux modernes et fonctionnels répondant aux besoins des résidents et des usagers du site.",
      "projectContent.douira-commercial-centers-2500-housing.faq.0.question": "En quoi consiste le projet des centres commerciaux de Douira ?",
      "projectContent.douira-commercial-centers-2500-housing.faq.0.answer": "Le projet de réalisation en corps d’état secondaire des centres commerciaux, intégré au programme des 2500 logements de Douira, est situé à Douira, Alger. Il s'agit d'un ensemble de centres commerciaux.",
      "projectContent.douira-commercial-centers-2500-housing.faq.1.question": "Quel est le périmètre du projet ?",
      "projectContent.douira-commercial-centers-2500-housing.faq.1.answer": "Le projet englobe la réalisation de deux centres commerciaux, pleinement intégrés à un vaste programme résidentiel de 2500 logements. Il s'agit de concevoir et de construire un ensemble coordonné de commerces et de services de proximité, destiné à répondre aux besoins quotidiens des habitants. Le périmètre des travaux inclut les espaces de vente, les zones de services, les circulations, ainsi que l'ensemble des finitions, le tout s'inscrivant dans le plan directeur d'aménagement du quartier.",
      "projectContent.douira-commercial-centers-2500-housing.faq.2.question": "Qu’est-ce qui distingue le projet ?",
      "projectContent.douira-commercial-centers-2500-housing.faq.2.answer": "Le projet se distingue par son rôle essentiel dans le développement des services de proximité au sein d'un important programme résidentiel de 2500 logements à Douira. La réalisation de ces deux centres commerciaux a permis de créer un pôle d'activités attractif, répondant aux besoins quotidiens des habitants. Leur conception a été pensée pour favoriser l'accessibilité, la fonctionnalité des espaces et le confort des usagers. Ces équipements contribuent ainsi à la valorisation du cadre urbain et au dynamisme économique du quartier.",
