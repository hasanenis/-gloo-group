      "projectContent.said-hamdine-mixed-real-estate.title": "Ensemble immobilier mixte cimposé de 05 blocs 202 logements promotionnels libres et 03 niveaux de commerce et 02 niveaux de parkings en sous sol a said hamdine",
      "projectContent.said-hamdine-mixed-real-estate.eyebrow": "PROJET MIXTE",
      "projectContent.said-hamdine-mixed-real-estate.summary.0": "Ensemble immobilier mixte cimposé de 05 blocs 202 logements promotionnels libres et 03 niveaux de commerce et 02 niveaux de parkings en sous sol a said hamdine est un projet mixte. Localisation: Said Hamdine ,Bir Mourad Rais ,Alger ,Algerie.",
      "projectContent.said-hamdine-mixed-real-estate.summary.1": "Le projet se distingue par son concept immobilier mixte associant logements, commerces et parkings au sein d’un même ensemble urbain. Composé de 5 blocs totalisant 202 logements promotionnels libres, il offre un cadre de vie moderne répondant aux besoins des résidents tout en favorisant l’accès aux services de proximité. Les 3 niveaux commerciaux renforcent l’attractivité du site et contribuent à son dynamisme économique, tandis que les 2 niveaux de parkings en sous-sol assurent une meilleure gestion du stationnement. Situé à Saïd Hamdine, le projet bénéficie d’un emplacement stratégique et d’une conception fonctionnelle favorisant confort, accessibilité et valorisation urbaine.",
      "projectContent.said-hamdine-mixed-real-estate.description.0": "Travaux de réalisation en tous corps d'état secondaire pour un ensemble immobilier mixte de 5 blocs, 202 logements promotionnels libres et 2 niveaux de parking en sous-sol. Nature : Ensemble immobilier mixte.",
      "projectContent.said-hamdine-mixed-real-estate.description.1": "Le projet se distingue par son concept immobilier mixte associant logements, commerces et parkings au sein d’un même ensemble urbain. Composé de 5 blocs totalisant 202 logements promotionnels libres, il offre un cadre de vie moderne répondant aux besoins des résidents tout en favorisant l’accès aux services de proximité. Les 3 niveaux commerciaux renforcent l’attractivité du site et contribuent à son dynamisme économique, tandis que les 2 niveaux de parkings en sous-sol assurent une meilleure gestion du stationnement. Situé à Saïd Hamdine, le projet bénéficie d’un emplacement stratégique et d’une conception fonctionnelle favorisant confort, accessibilité et valorisation urbaine.",
      "projectContent.said-hamdine-mixed-real-estate.authority": "Igloo Construction coordonne la réalisation avec la rigueur nécessaire pour l'ensemble immobilier mixte. Livraison immobilière mixte sur cinq blocs avec logements et deux niveaux de parking en sous-sol.",
