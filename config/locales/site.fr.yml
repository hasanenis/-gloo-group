      "projectContent.dely-brahim-240-housing.faq.1.question": "Quel est le programme de l'opération ?",
      "projectContent.dely-brahim-240-housing.faq.1.answer": "Le programme de l'opération comprend la construction d'un ensemble résidentiel mixte de haute densité, intégrant 240 logements, des surfaces commerciales, des services, des aménagements de voirie et réseaux divers (VRD), ainsi que des parkings en sous-sol.",
      "projectContent.dely-brahim-240-housing.faq.2.question": "Qu’est-ce qui distingue le projet ?",
      "projectContent.dely-brahim-240-housing.faq.2.answer": "Ce projet se distingue par sa conception verticale innovante, avec une tour résidentielle de 33 étages, optimisant l'occupation du terrain. Il propose un ensemble mixte intégrant 240 logements de diverses typologies, des commerces, des services et des parkings en sous-sol, offrant ainsi une autonomie et un confort accrus aux résidents. Son implantation stratégique à Bois des Cars, Dely Brahim, assure une excellente accessibilité et une intégration harmonieuse dans un environnement urbain de qualité, complétée par des infrastructures VRD et techniques modernes.",
