      "projectContent.said-hamdine-mixed-real-estate.title": "Ensemble immobilier mixte à Saïd Hamdine : 202 logements promotionnels libres, commerces et parkings.",
      "projectContent.said-hamdine-mixed-real-estate.eyebrow": "PROJET MIXTE",
      "projectContent.said-hamdine-mixed-real-estate.summary.0": "À Saïd Hamdine, cet ensemble immobilier mixte réunit 202 logements, des surfaces commerciales et des stationnements intégrés.",
      "projectContent.said-hamdine-mixed-real-estate.summary.1": "Cet ensemble immobilier mixte, situé à Saïd Hamdine, est composé de 5 blocs résidentiels totalisant 202 logements promotionnels libres. Il intègre également 3 niveaux commerciaux et 2 niveaux de parkings en sous-sol, assurant une offre complète de services et de stationnement. La conception du projet inclut l'ensemble des travaux de gros œuvre et de second œuvre pour une réalisation cohérente et fonctionnelle.",
      "projectContent.said-hamdine-mixed-real-estate.description.0": "Les travaux de second œuvre ont porté sur un ensemble immobilier mixte réunissant 202 logements, des espaces commerciaux et des stationnements intégrés.",
      "projectContent.said-hamdine-mixed-real-estate.description.1": "Cet ensemble immobilier mixte et dense comprend 5 blocs de logements, 3 niveaux commerciaux et 2 niveaux de parkings en sous-sol. La livraison de ce complexe de 202 logements promotionnels libres intègre l'ensemble des travaux de gros œuvre et de second œuvre, assurant une cohérence structurelle et fonctionnelle.",
      "projectContent.said-hamdine-mixed-real-estate.authority": "Igloo Construction coordonne les logements, les espaces commerciaux et les ouvrages d'accompagnement dans une même opération de chantier.",
