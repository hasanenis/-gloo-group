      "projectContent.bas-mazagran-200-38-housing.nearby.items.0": "Commerces de proximité",
      "projectContent.bas-mazagran-200-38-housing.faq.0.question": "En quoi consiste le projet de 200 logements promotionnels aidés et 38 logements promotionnels libres à Bas Mazagran, Mostaganem ?",
      "projectContent.bas-mazagran-200-38-housing.faq.0.answer": "Le projet de 200 logements promotionnels aidés et 38 logements promotionnels libres, incluant les travaux TCE et VRD avec locaux commerciaux, est implanté au pôle d’excellence de Bas Mazagran, Mostaganem, en Algérie. Il s’agit d’un programme résidentiel intégrant des commerces.",
      "projectContent.bas-mazagran-200-38-housing.faq.1.question": "Quel est le périmètre du projet ?",
      "projectContent.bas-mazagran-200-38-housing.faq.1.answer": "Le projet consiste en la réalisation de 7 blocs de logements promotionnels (200 aidés et 38 libres) de type R+5 et R+9, intégrant des commerces au rez-de-chaussée. Il propose des logements F3 de 70,85 m² et F4 de 85 m², avec 4 logements par étage. La surface des blocs varie entre 385,90 m² et 420 m². Ce programme mixte inclut également les infrastructures de voirie et réseaux divers (VRD), et vise à offrir un cadre de vie moderne et confortable, répondant aux besoins de proximité des résidents grâce aux espaces commerciaux intégrés.",
      "projectContent.bas-mazagran-200-38-housing.faq.2.question": "Qui a porté la réalisation ?",
      "projectContent.bas-mazagran-200-38-housing.faq.2.answer": "Client : OPGI.",
      "projectContent.bas-mazagran-200-38-housing.faq.3.question": "Qu’est-ce qui distingue le projet ?",
      "projectContent.bas-mazagran-200-38-housing.faq.3.answer": "Ce projet se distingue par la réalisation intégrée de 200 logements promotionnels aidés et 38 logements promotionnels libres, complétés par des locaux commerciaux et les infrastructures de voirie et réseaux divers (VRD) à Bas Mazagran. Il comprend 7 blocs résidentiels de type R+5 et R+9, offrant des logements F3 de 70,85 m² et F4 de 85 m², avec 4 logements par étage. Les surfaces des blocs varient entre 385,90 m² et 420 m². Cette approche vise à créer un cadre de vie moderne et confortable, répondant aux besoins de proximité des résidents grâce à l'intégration des espaces commerciaux.",
