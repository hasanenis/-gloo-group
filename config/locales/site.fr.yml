      "projectContent.rouiba-4-promotional-villas.title": "Réalisation de 4 Villas Promotionnelles Libres à Rouiba (TCE, VRD)",
      "projectContent.rouiba-4-promotional-villas.eyebrow": "PROJET RÉSIDENTIEL",
      "projectContent.rouiba-4-promotional-villas.summary.0": "Ce projet résidentiel concerne la réalisation de 4 villas promotionnelles libres à Rouiba, Alger, en Algérie.",
      "projectContent.rouiba-4-promotional-villas.summary.1": "Ce projet résidentiel se caractérise par la réalisation de quatre villas individuelles à Rouiba, offrant un cadre de vie de qualité. La conception assure intimité, confort et indépendance aux futurs occupants. L'intégration des travaux de VRD et des aménagements extérieurs garantit une accessibilité optimale et un environnement soigné. Son implantation dans un secteur urbain en développement constitue un atout majeur, contribuant à la valorisation du patrimoine immobilier et au bien-être des résidents.",
      "projectContent.rouiba-4-promotional-villas.description.0": "Travaux de construction en Tous Corps d'État (TCE), incluant les Voiries et Réseaux Divers (VRD), pour 4 villas promotionnelles à Rouiba. Nature du programme : Villas promotionnelles libres.",
      "projectContent.rouiba-4-promotional-villas.description.1": "Ce programme résidentiel de petite envergure comprend quatre villas promotionnelles. Il intègre l'aménagement des accès au site, la coordination des réseaux utilitaires et les travaux secondaires. Les villas sont livrées avec l'ensemble des infrastructures de voirie et de réseaux.",
      "projectContent.rouiba-4-promotional-villas.authority": "Igloo Construction coordonne la réalisation de ces villas promotionnelles libres avec la rigueur nécessaire. Le projet inclut la livraison des villas avec l'ensemble des aménagements de voirie et de réseaux.",
      "projectContent.rouiba-4-promotional-villas.seo": "Découvrez la galerie, les détails techniques et les repères de localisation du projet de 4 Villas Promotionnelles Libres à Rouiba. Ce projet illustre un modèle de réalisation résidentiel mené avec une approche méthodique.",
