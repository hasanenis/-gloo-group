      "projectContent.staoueli-11-41-villas.title": "Réalisation des travaux en tous corps d'état secondaire, y compris VRD, pour 11/41 villas au lieu-dit Les Pastorales à Staouéli.",
      "projectContent.staoueli-11-41-villas.eyebrow": "PROJET RÉSIDENTIEL",
      "projectContent.staoueli-11-41-villas.summary.0": "Ce projet résidentiel concerne la réalisation des travaux en tous corps d'état (TCE) secondaire, y compris les VRD, pour 11 des 41 villas situées au lieu-dit Les Pastorales à Staouéli, Alger, Algérie.",
      "projectContent.staoueli-11-41-villas.summary.1": "Ce programme résidentiel intègre la construction de villas et l'aménagement des réseaux viaires et des infrastructures de viabilisation (VRD) nécessaires à la pleine opérationnalité du site.",
      "projectContent.staoueli-11-41-villas.description.0": "Ce projet comprend la réalisation des travaux en tous corps d'état (TCE) secondaire, incluant les voiries et réseaux divers (VRD), pour le programme de 11/41 villas à Staouéli. Nature du programme : Villas promotionnelles libres.",
      "projectContent.staoueli-11-41-villas.description.1": "Le programme associe la construction de villas résidentielles à l'aménagement des voiries, des réseaux d'utilité publique et des infrastructures de site coordonnées, garantissant ainsi la pleine viabilisation du terrain.",
      "projectContent.staoueli-11-41-villas.authority": "Igloo Construction assure la coordination et la réalisation de ce projet avec la rigueur nécessaire, couvrant les villas promotionnelles libres, les voiries, les réseaux d'utilité publique et l'ensemble des infrastructures de site.",
      "projectContent.staoueli-11-41-villas.seo": "Découvrez la galerie, les détails techniques et les informations de localisation du projet 11/41 Villas et VRD. Ce projet illustre une approche de développement résidentiel structurée et maîtrisée.",
