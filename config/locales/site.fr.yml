      "projectContent.rouiba-4-promotional-villas.faq.0.answer": "Les travaux de réalisation en TCE, y compris VRD, de 4 villas promotionnelles libres à Rouiba se situent à Rouiba, Alger, Algérie. Il s’agit d’un ensemble de villas promotionnelles libres.",
