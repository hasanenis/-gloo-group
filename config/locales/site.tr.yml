      "projectContent.douaouda-300-500-housing.summary.0": "Douaouda, Tipaza'da yer alan bu karma kullanımlı proje, 300/500 destekli konut (LPA) projesidir. Konut blokları ve profesyonel kullanım alanlarını içerir.",
