      "projectContent.rouiba-4-promotional-villas.images.constructionGallery.2.alt": "Yüksekten görünüm: Modern mimarili, düz çatılı ve balkonlu, yeni inşa edilmiş beyaz villalar. Solda bir vinç kolu, arka planda yoğun bir yerleşim bölgesi.",
      "projectContent.rouiba-4-promotional-villas.images.constructionGallery.2.caption": "Rouiba'da tamamlanma aşamasındaki modern villalar.",
      "projectContent.rouiba-4-promotional-villas.images.constructionGallery.3.alt": "Villa şantiyesinin yüksekten görünümü: Beton temeller, kolonlar için ahşap kalıplar ve inşaat işçileri. Sol tarafta sarı bir vinç kolu, arka planda ise ağaçlı ve araçların olduğu bir cadde.",
      "projectContent.rouiba-4-promotional-villas.images.constructionGallery.3.caption": "Rouiba'daki villa şantiyesinde inşaat çalışmaları.",
      "projectContent.rouiba-4-promotional-villas.images.featured.0.alt": "Igloo Construction proje görseli",
