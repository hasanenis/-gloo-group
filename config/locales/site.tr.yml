      "projectContent.sidi-abdallah-200-1200-housing.details.3.value": "Ticari ve mesleki birimler",
      "projectContent.sidi-abdallah-200-1200-housing.details.4.label": "Proje Amacı",
      "projectContent.sidi-abdallah-200-1200-housing.details.4.value": "Konutları, gündelik ihtiyaçlara yönelik hizmet ve ticaret birimleriyle bir arada çözmek.",
      "projectContent.sidi-abdallah-200-1200-housing.facilityGroups.0.title": "Proje Bileşenleri",
      "projectContent.sidi-abdallah-200-1200-housing.facilityGroups.0.items.0": "Kamu Konutu (LPP)",
      "projectContent.sidi-abdallah-200-1200-housing.facilityGroups.0.items.1": "R+9",
      "projectContent.sidi-abdallah-200-1200-housing.facilityGroups.0.items.2": "Ticari ve mesleki birimler",
      "projectContent.sidi-abdallah-200-1200-housing.facilityGroups.0.items.3": "Modern konutlar ve yerleşimin gündelik ihtiyaçlarına yönelik hizmet birimleri.",
      "projectContent.sidi-abdallah-200-1200-housing.faq.0.question": "200/1200 LPP Konut Projesi nedir?",
      "projectContent.sidi-abdallah-200-1200-housing.faq.0.answer": "Sidi Abdellah, Cezayir'de inşa edilen bir kamu konutu (LPP) projesidir.",
      "projectContent.sidi-abdallah-200-1200-housing.faq.1.question": "Projenin kapsamı neydi?",
      "projectContent.sidi-abdallah-200-1200-housing.faq.1.answer": "Büyük ölçekli bir kamu konutu işiydi. Konutlarla birlikte diğer kamu yapılarının ve altyapının inşası da üstlenildi.",
      "projectContent.sidi-abdallah-200-1200-housing.faq.2.question": "Projenin temel özellikleri nelerdir?",
      "projectContent.sidi-abdallah-200-1200-housing.faq.2.answer": "Sidi Abdallah - Mahalma'daki 200/1200 LPP konut yerleşimi içindeki diğer tüm kamu yapılarının inşaatı da bu sözleşme dahilindeydi.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.0.alt": "Alçak bir açıdan görülen yüksek ve modern apartman binası. Bej ve şeftali tonlarındaki cephesi, siyah vurguları, çok sayıda balkonu ve aydınlatılmış pencereleri.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.0.caption": "Özgün mimari öğelere sahip modern toplu konut cephesi.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.1.alt": "Gri ve bulutlu bir gökyüzü önünde, alçak bir açıdan görünen yüksek ve modern bir toplu konut binası. Açık renkli duvarları, siyah ve şeftali tonlarındaki vurguları, koyu renk korkuluklu balkonları ve bazı pencerelerden yansıyan iç mekân ışıkları seçiliyor.",
      "projectContent.sidi-abdallah-200-1200-housing.images.hero.1.caption": "Kendine özgü cephesi ve balkonlarıyla modern toplu konut mimarisi.",
      "projectContent.sidi-abdallah-200-1200-housing.images.intro.alt": "Sosyal konut binasının ortak alanı. Açık renkli taş duvarlar, dikey ahşap detaylar, gömme bitkilik ve işlemeli metal kapıya uzanan desenli mermer zemin.",
      "projectContent.sidi-abdallah-200-1200-housing.images.intro.caption": "Modern ve davetkâr ortak alan iç mekânı.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.0.alt": "Sosyal konut binasının ortak alanı: Ortada asansör, solda ahşap posta kutuları, üst katta dekoratif metal korkuluk. Mermer ve taş kaplı mekânda gömme aydınlatmalar ve ağaç motifli bir duvar resmi bulunuyor.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.0.caption": "Sosyal konut projesinin şık ortak alanları ve donatıları.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.1.alt": "Geniş açılı bir görünüm: Bej, koyu mavi ve şeftali rengi cepheli, çok katlı apartman blokları. Binalar, üzerinde kırmızı boru yığınları, beton bloklar, bir kamyon ve bir ekskavatör bulunan bir şantiyede yer alıyor. Ön planda yürüyen iki kişi ve kapalı gökyüzü.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.1.caption": "Altyapı çalışmalarının devam ettiği, tamamlanma aşamasındaki sosyal konut projesi.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.2.alt": "Sosyal konut binasının ortak alanı. Açık renkli taş duvarlar, dikey ahşap detaylar, gömme bitkilik ve işlemeli metal kapıya uzanan desenli mermer zemin.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.2.caption": "Modern ve davetkâr ortak alan iç mekânı.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.3.alt": "Kapalı bir gökyüzü önünde, alçak açıdan çekilmiş modern bir kamu konutu binası. Açık renkli duvarlar, siyah ve şeftali rengi vurgular, koyu renk korkuluklu balkonlar ve bazı pencerelerden sızan iç aydınlatma ışıkları.",
      "projectContent.sidi-abdallah-200-1200-housing.images.mosaic.3.caption": "Özgün cephesi ve balkonlarıyla modern bir kamu konutu yapısı.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.0.alt": "Açık mavi bir gökyüzü önünde, beyaz, mavi ve şeftali rengi cepheleriyle iki adet yüksek kamu konutu binası. Ön planda, devam eden şantiye çalışmalarını gösteren toprak yığınları ve inşaat malzemeleri.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.0.caption": "İnşaatı süren modern kamu konutu blokları.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.1.alt": "Bir kamu konutu binasının ortak alanı. Açık renkli taş duvarlar, dikey ahşap unsurlar, ankastre bitkilik ve işlemeli metal bir kapıya uzanan desenli mermer zemin.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.1.caption": "Yapının modern tasarımlı ortak alanı.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.2.alt": "Kapalı bir gökyüzü önünde, alçak açıdan çekilmiş modern bir kamu konutu binası. Açık renkli duvarlar, siyah ve şeftali rengi vurgular, koyu renk korkuluklu balkonlar ve bazı pencerelerden sızan iç aydınlatma ışıkları.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.2.caption": "Özgün cephesi ve balkonlarıyla modern bir kamu konutu yapısı.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.3.alt": "Alçak açıdan çekilmiş çağdaş bir apartman binası. Siyah vurgulu bej ve şeftali tonlarındaki dış cephe, çok sayıda balkon ve aydınlatılmış pencereler.",
      "projectContent.sidi-abdallah-200-1200-housing.images.featureGallery.3.caption": "Modern kamu konutu cephesinden özgün mimari ayrıntılar.",
