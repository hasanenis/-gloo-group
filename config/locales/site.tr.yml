      "projectContent.reghaia-bouraada-250-housing.faq.0.question": "Reghaia Bouraada 250 Konut projesi nedir?",
      "projectContent.reghaia-bouraada-250-housing.faq.0.answer": "Cezayir'in Reghaia ilçesine bağlı Bourrade'da, AADL'nin kiralama-satın alma programı için inşa edilmiş bir projedir. 250 konut, ticari alanlar ve kapıcı dairelerinden oluşur.",
      "projectContent.reghaia-bouraada-250-housing.faq.1.question": "Projenin kapsamı neydi?",
      "projectContent.reghaia-bouraada-250-housing.faq.1.answer": "Kiralama-satın alma programı için konutlar, ticari alanlar ve kapıcı daireleri inşa edildi.",
      "projectContent.reghaia-bouraada-250-housing.faq.2.question": "Projenin işvereni kimdi?",
      "projectContent.reghaia-bouraada-250-housing.faq.2.answer": "AADL.",
      "projectContent.reghaia-bouraada-250-housing.faq.3.question": "Bu projenin özelliği nedir?",
      "projectContent.reghaia-bouraada-250-housing.faq.3.answer": "Reghaia'daki Bouraada yerleşiminde, kiralama-satın alma programına ait 250 konutun, ticari alanların ve kapıcı dairelerinin inşaatı tamamlandı.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.0.alt": "Çok katlı konut ve ticaret yapısının dış cephesini gösteren üç boyutlu modelleme. Modern tasarımlı yapının cephesinde sarı, beyaz ve koyu gri paneller kullanılmış. Zemin katında ticari birimler, üst katlarda ise balkonlu konutlar bulunuyor. Arka planda bulutlu, karanlık bir gökyüzü var.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.0.caption": "Bouraada konut ve ticaret projesinin mimari görselleştirmesi.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.1.alt": "Çok katlı modern konut yapısının tüm cephesini gösteren mimari modelleme. Cephede beyaz, sarı ve koyu gri paneller, zemin katta ise ticari birimler var. Ön planda otopark ve peyzaj düzenlemesi, arka planda bulutlu bir gökyüzü görülüyor.",
      "projectContent.reghaia-bouraada-250-housing.images.hero.1.caption": "Bouraada konut projesinin mimari görselleştirmesi.",
      "projectContent.reghaia-bouraada-250-housing.images.intro.alt": "Sarı, siyah ve beyaz renkli cephesi ve çok sayıda balkonuyla yüksek ve modern bir konut yapısı. Arka planda açık mavi gökyüzü. Ön planda, yeni bordür taşları döşenmiş, toprak zeminli şantiye alanı.",
      "projectContent.reghaia-bouraada-250-housing.images.intro.caption": "Cephesinde sarı ve siyah renklerin kullanıldığı modern konut binası, inşaat aşamasında.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.0.alt": "Yüksek açıdan şantiye görünümü: İnşaatı süren çok katlı yapının tuğla dolgu duvarları ve betonarme karkası, mavi bir kule vinç, iş makineleri ve toprak zemin üzerindeki şantiye ofisleri.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.0.caption": "Bouraada şantiyesinden inşaat süreci: Kule vinç ve yapıların betonarme karkasları.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.1.alt": "İnşaatı devam eden çok katlı konut binası: Açık renkli duvarlar, siyah korkuluklu balkonlar ve zemin kat seviyesinde inşaat malzemeleri.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.1.caption": "Bouraada şantiyesindeki konut inşaatının ilerleyişi.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.2.alt": "Sarı, siyah ve beyaz cepheli, balkonlu, yüksek konut binası. Ön planda inşaat malzemeleri ve toprak zemin.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.2.caption": "İnşaatı devam eden modern konut binasının cephesi.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.3.alt": "Çok katlı modern konut binasının 3B mimari görselleştirmesi. Beyaz, sarı ve koyu gri panelli cephe, zemin katta ticari birimler. Ön planda otopark ve peyzaj düzenlemesi.",
      "projectContent.reghaia-bouraada-250-housing.images.mosaic.3.caption": "Bouraada konut projesinin mimari görseli.",
      "projectContent.reghaia-bouraada-250-housing.images.featureGallery.0.alt": "Yapımı yeni tamamlanmış çok katlı apartman bloğu. Sarı, siyah ve beyaz yatay şeritli cephe, çok sayıda balkon ve pencere. Ön planda, bordür taşları ve beton blok paletleri bulunan toprak zeminli şantiye alanı.",
      "projectContent.reghaia-bouraada-250-housing.images.featureGallery.0.caption": "Tamamlanmak üzere olan modern konut binasının cephesi.",
