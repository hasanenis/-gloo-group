      "projectContent.reghaia-bouraada-250-housing.images.featureGallery.2.caption": "İnşaatı süren konut binasının sarı ve siyah renkli cephe detayları.",
      "projectContent.reghaia-bouraada-250-housing.images.featureGallery.3.alt": "Çok katlı modern konut binasının 3B mimari görselleştirmesi. Beyaz, sarı ve koyu gri panelli cephe, zemin katta ticari birimler. Ön planda otopark ve peyzaj düzenlemesi.",
