      "projectContent.reghaia-bouraada-250-housing.summary.0": "Cezayir'in Reghaia bölgesindeki Bourrada'da inşa edilen bu karma kullanımlı proje, 250 konut, kiralık ticari birimler ve kapıcı hizmet alanlarından oluşur.",
      "projectContent.reghaia-bouraada-250-housing.summary.1": "İşveren: AADL",
      "projectContent.reghaia-bouraada-250-housing.description.0": "Reghaia'daki Bourrada şantiyesinde, AADL'nin kiralama-satış (location-vente) modeliyle geliştirilen 250 konut inşa edildi. Projede ayrıca ticari kullanıma yönelik alanlar ve kapıcı daireleri de yer alıyor.",
      "projectContent.reghaia-bouraada-250-housing.description.1": "İşin kapsamı, kiralama-satış modeliyle üretilen konutların, ticari birimlerin ve kapıcı dairelerinin tamamlanmasıdır.",
      "projectContent.reghaia-bouraada-250-housing.authority": "Igloo Construction, konut, ticaret ve hizmet işlevlerini birleştiren bu tür karma projelerin teslim süreçlerini, işin gerektirdiği disiplinle yönetir.",
