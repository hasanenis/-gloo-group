      "projectContent.sidi-abdallah-200-1200-housing.images.constructionGallery.0.caption": "Yeni bir kamu konutu dairesinin girişi.",
      "projectContent.sidi-abdallah-200-1200-housing.images.constructionGallery.1.alt": "Bir kamu konutu binasının ortak alanı. Açık renkli taş duvarlar, dikey ahşap unsurlar, ankastre bitkilik ve işlemeli metal bir kapıya uzanan desenli mermer zemin.",
      "projectContent.sidi-abdallah-200-1200-housing.images.constructionGallery.1.caption": "Yapının modern tasarımlı ortak alanı.",
      "projectContent.sidi-abdallah-200-1200-housing.images.constructionGallery.2.alt": "Kapalı bir gökyüzü önünde, alçak açıdan çekilmiş modern bir kamu konutu binası. Açık renkli duvarlar, siyah ve şeftali rengi vurgular, koyu renk korkuluklu balkonlar ve bazı pencerelerden sızan iç aydınlatma ışıkları.",
      "projectContent.sidi-abdallah-200-1200-housing.images.constructionGallery.2.caption": "Özgün cephesi ve balkonlarıyla modern bir kamu konutu yapısı.",
      "projectContent.sidi-abdallah-200-1200-housing.images.constructionGallery.3.alt": "Alçak açıdan çekilmiş çağdaş bir apartman binası. Siyah vurgulu bej ve şeftali tonlarındaki dış cephe, çok sayıda balkon ve aydınlatılmış pencereler.",
