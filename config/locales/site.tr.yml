      "projectContent.staoueli-11-41-villas.faq.0.question": "11/41 Villaları ve Altyapı İşleri projesi nedir?",
      "projectContent.staoueli-11-41-villas.faq.0.answer": "Cezayir, Staouali'de yer alan bir serbest satışlı konut (LPL) projesidir.",
      "projectContent.staoueli-11-41-villas.faq.1.question": "Projenin kapsamı neydi?",
      "projectContent.staoueli-11-41-villas.faq.1.answer": "Villalar, yolları ve altyapı şebekeleriyle birlikte eksiksiz olarak tamamlandı.",
      "projectContent.staoueli-11-41-villas.faq.2.question": "Projenin ayırt edici özellikleri nelerdir?",
      "projectContent.staoueli-11-41-villas.faq.2.answer": "Villalar, tüm ince işleri (TCE), yolları ve altyapı şebekeleriyle bir bütün olarak inşa edildi.",
      "projectContent.staoueli-11-41-villas.images.hero.0.alt": "Açık mavi gökyüzü altında, yeni tamamlanmış konut villaları. Açık renkli cepheler, koyu renkli detaylar, cam korkuluklu balkonlar ve kırmızı kiremit çatılar.",
      "projectContent.staoueli-11-41-villas.images.hero.0.caption": "Balkonlu ve modern tasarımlı, tamamlanmış villalar.",
      "projectContent.staoueli-11-41-villas.images.hero.1.alt": "Çok katlı konut binasının dış cephesi. Beyaz ve açık pembe duvarlar, koyu gri mimari detaylar, cam korkuluklu balkonlar, zemin kat girişleri ve garaj kapıları üzerinde ahşap sundurmalar. Ön planda taş döşeli bir yol.",
      "projectContent.staoueli-11-41-villas.images.hero.1.caption": "Zarif detayları ve özel balkonlarıyla modern konut villaları.",
      "projectContent.staoueli-11-41-villas.images.intro.alt": "Sıra halinde dizili, açık renkli modern villalar. Koyu renkli detaylar, cam balkonlar, terakota kiremit çatılar ve açık mavi gökyüzü.",
      "projectContent.staoueli-11-41-villas.images.intro.caption": "Modern tasarımlı ve cam balkonlu, tamamlanmış konut villaları.",
      "projectContent.staoueli-11-41-villas.images.mosaic.0.alt": "Yeni tamamlanmış mutfak. Parlak, koyu mermer desenli zemin döşemesi, krem rengi alt dolaplar, koyu renk tezgah, gri ve beyaz geometrik desenli tezgah arası, koyu kahverengi ahşap dokulu üst dolaplar. Ön planda, zeminde mavi bir bez.",
      "projectContent.staoueli-11-41-villas.images.mosaic.0.caption": "Desenli tezgah arası ve koyu mermer görünümlü zeminiyle modern bir mutfak.",
      "projectContent.staoueli-11-41-villas.images.mosaic.1.alt": "İnşaat halindeki çok katlı villa. Cephede iskele, temelde brüt beton. Üst kat balkonunda dinlenen iki işçi.",
      "projectContent.staoueli-11-41-villas.images.mosaic.1.caption": "İnşaat halindeki bir konut villasının dış cephe çalışmaları ve iskelesi.",
      "projectContent.staoueli-11-41-villas.images.mosaic.2.alt": "Çok katlı konut binasının dış cephesi. Beyaz ve açık pembe duvarlar, koyu gri mimari detaylar, cam korkuluklu balkonlar, zemin kat girişleri ve garaj kapıları üzerinde ahşap sundurmalar. Ön planda taş döşeli bir yol.",
      "projectContent.staoueli-11-41-villas.images.mosaic.2.caption": "Şık detayları ve özel balkonlarıyla modern konut villaları.",
      "projectContent.staoueli-11-41-villas.images.mosaic.3.alt": "Açık mavi gökyüzü altında, yeni tamamlanmış konut villaları. Açık renkli cepheler, koyu renkli detaylar, cam korkuluklu balkonlar ve kırmızı kiremit çatılar.",
      "projectContent.staoueli-11-41-villas.images.mosaic.3.caption": "Modern tasarımlı ve balkonlu, tamamlanmış konut villaları.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.0.alt": "Villada L planlı, modern bir mutfak. Koyu granit tezgahlar, krem rengi alt dolaplar, beyaz üst dolaplar ve koyu kahverengi ahşap görünümlü duvar dolapları. Gazlı ocak, çift gözlü paslanmaz çelik eviye, desenli tezgah arası ve koyu mermer görünümlü zemin döşemesi.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.0.caption": "Desenli tezgah arası ve koyu renkli detaylarıyla modern bir mutfak.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.1.alt": "Çok katlı konut villasının dış cephesi: Açık bej duvarlar, koyu renkli pencere doğramaları, cam ve metal korkuluklu balkonlar, terakota kiremit çatı. Görüntünün üstünü beton bir kiriş kesiyor. Sağ alt köşede '2022.9.21 11:52' zaman damgası.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.1.caption": "Modern detaylarla tamamlanmış bir villanın dış cephesi.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.2.alt": "Çok katlı konut binasının dış cephesi. Beyaz ve açık pembe duvarlar, koyu gri mimari detaylar, cam korkuluklu balkonlar, zemin kat girişleri ve garaj kapıları üzerinde ahşap sundurmalar. Ön planda taş döşeli bir yol.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.2.caption": "Şık detayları ve özel balkonlarıyla modern konut villaları.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.3.alt": "Yeni tamamlanmış konut villalarının dış cephesi. Açık renkli duvarlar, koyu renkli mimari öğeler, cam korkuluklu balkonlar ve kırmızı kiremitli çatılar.",
      "projectContent.staoueli-11-41-villas.images.featureGallery.3.caption": "Modern tasarımlı, tamamlanmış konut villaları.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.0.alt": "Yeni inşa edilmiş çok katlı konut villalarının dış cephesi. Beyaz duvarlar, koyu gri mimari detaylar, terakota kiremitli çatılar ve cam panelli balkonlar. Sağda, zemin katta bir kişi seçiliyor.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.0.caption": "Oturuma hazır, modern villalar.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.1.alt": "Yeni tamamlanmış konut villalarının dış cephesi. Açık renkli duvarlar, koyu renkli mimari öğeler, cam korkuluklu balkonlar ve kırmızı kiremitli çatılar.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.1.caption": "Modern tasarımlı, tamamlanmış konut villaları.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.2.alt": "Çok katlı bir konut binasının dış cephesi. Beyaz ve açık pembe duvarlar, koyu gri mimari detaylar, cam korkuluklu balkonlar. Zemin kat girişleri ve garaj kapılarının üzerinde ahşap sundurmalar var. Ön planda taş döşeli bir yol görülüyor.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.2.caption": "Şık bitişli ve özel balkonlu modern konut villaları.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.3.alt": "Yeni bitirilmiş bir mutfağın içi. Zeminde koyu ve parlak mermer desenli karolar, açık krem rengi alt dolaplar, koyu renk tezgah, gri-beyaz geometrik desenli tezgah arası panel ve koyu kahverengi ahşap dokulu üst dolaplar. Ön planda, yerde mavi bir bez duruyor.",
      "projectContent.staoueli-11-41-villas.images.constructionGallery.3.caption": "Modern mutfak içi: Desenli tezgah arası ve koyu mermer görünümlü zemin.",
      "projectContent.staoueli-11-41-villas.images.featured.0.alt": "Yeni tamamlanmış konut villalarının dış cephesi. Açık renkli duvarlar, koyu renkli mimari öğeler, cam korkuluklu balkonlar ve kırmızı kiremitli çatılar.",
