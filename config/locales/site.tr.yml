      "projectContent.dely-brahim-240-housing.faq.0.question": "Dely Brahim 240 Konut projesinin niteliği nedir?",
      "projectContent.dely-brahim-240-housing.faq.0.answer": "Cezayir'in Dely Brahim bölgesinde yer alan proje, 240 adet serbest satışlı konut (LPL), ticari alanlar ve hizmet birimlerinden oluşur.",
      "projectContent.dely-brahim-240-housing.faq.1.question": "Projenin kapsamı nedir?",
      "projectContent.dely-brahim-240-housing.faq.1.answer": "İş kapsamında konutlar, ticari alanlar, hizmet birimleri, yollar, altyapı şebekeleri ve yer altı otoparkı inşa edildi.",
      "projectContent.dely-brahim-240-housing.faq.2.question": "Projenin kayda değer yönü nedir?",
      "projectContent.dely-brahim-240-housing.faq.2.answer": "Yüksek yoğunluklu bir konut bloğunun, ticari alanlar, hizmet birimleri ve yer altı otoparkı ile birlikte karma bir yapı olarak çözülmesidir.",
      "projectContent.dely-brahim-240-housing.images.hero.0.alt": "Modern karma kullanımlı binanın gece görünümü: Işıklandırılmış konut balkonları, hareketli ticari vitrinler, çok katlı yeraltı otoparkı, önünde ağaçlar ve akan trafik.",
      "projectContent.dely-brahim-240-housing.images.hero.0.caption": "Karma kullanımlı binanın gece görünümü; konut, ticari alanlar ve otopark.",
      "projectContent.dely-brahim-240-housing.images.hero.1.alt": "Gece görünümünde çok katlı modern bir bina. Zemin katında aydınlık ticari dükkânlar, üst katlarda ise balkonlu konutlar bulunuyor. Sokakta hareketten dolayı bulanıklaşmış araçlar ve bir yaya görülüyor.",
      "projectContent.dely-brahim-240-housing.images.hero.1.caption": "Aydınlatılmış konut ve ticari birimleriyle karma kullanımlı yapı, gece.",
      "projectContent.dely-brahim-240-housing.images.intro.alt": "Akşam göğü fonunda, modern bir konut binası. Balkonları ve zemin kattaki ticari alanları aydınlatılmış. Ön planda ağaçlar ve bir yol var.",
      "projectContent.dely-brahim-240-housing.images.intro.caption": "Yüksek yapının gece ışıklandırması; konut ve ticari birimler.",
      "projectContent.dely-brahim-240-housing.images.mosaic.0.alt": "Yıldızlı bir gecede, cephesinde dikey ışık şeritleri ve aydınlatılmış balkonları olan yüksek, modern bir konut binası. Zemin katta geniş vitrinli, aydınlık dükkânlar var. Önünden geçen yolda araç ışıkları ve ağaçlar görülüyor.",
      "projectContent.dely-brahim-240-housing.images.mosaic.0.caption": "Karma kullanımlı yapının hareketli ticari cephesi, gece.",
      "projectContent.dely-brahim-240-housing.images.mosaic.1.alt": "Modern karma kullanımlı binanın gece görünümü: Işıklandırılmış konut balkonları, hareketli ticari vitrinler, çok katlı yeraltı otoparkı, önünde ağaçlar ve akan trafik.",
