      "projectContent.bas-mazagran-200-38-housing.faq.0.question": "Projenin konut dökümü ve niteliği nedir?",
      "projectContent.bas-mazagran-200-38-housing.faq.0.answer": "Mostaganem'in Bas Mazagran bölgesinde, 200 adet destekli konut (LPA) ve 38 adet serbest satışlı konut (LPL) ile bu konutlara hizmet veren ticari birimler inşa edildi.",
      "projectContent.bas-mazagran-200-38-housing.faq.1.question": "İşin kapsamı neydi?",
      "projectContent.bas-mazagran-200-38-housing.faq.1.answer": "Konutlar ve ticari birimlerin yanı sıra, yerleşime ait yollar ve altyapı şebekeleri de tamamlandı.",
      "projectContent.bas-mazagran-200-38-housing.faq.2.question": "İşveren kimdir?",
      "projectContent.bas-mazagran-200-38-housing.faq.2.answer": "OPGI.",
      "projectContent.bas-mazagran-200-38-housing.faq.3.question": "Projenin ayırt edici niteliği nedir?",
      "projectContent.bas-mazagran-200-38-housing.faq.3.answer": "Proje, farklı konut tiplerini, ticari alanları ve altyapı işlerini tek bir bütün olarak ele almasıyla önem taşır.",
      "projectContent.bas-mazagran-200-38-housing.images.hero.0.alt": "İnşaatı süren, betonarme iskeletli ve kırmızı tuğla dolgu duvarlı çok katlı konutlar. Ön planda yürüyen bir kişi, arka planda açık mavi bir gökyüzü.",
      "projectContent.bas-mazagran-200-38-housing.images.hero.0.caption": "Bas Mazagran konutlarında inşaatın ilerleyişi.",
      "projectContent.bas-mazagran-200-38-housing.images.hero.1.alt": "İnşaatın farklı aşamalarındaki betonarme konutların ve mavi bir kule vincin yer aldığı şantiye. Zeminde inşaat malzemeleri ve filiz demirleri seçiliyor.",
      "projectContent.bas-mazagran-200-38-housing.images.hero.1.caption": "Kule vinç eşliğinde ilerleyen konut inşaatı.",
      "projectContent.bas-mazagran-200-38-housing.images.intro.alt": "Şantiye genel görünümü. Ön planda hafriyat yığınları, bir kule vinç ve bir mobil vinç. Arka planda, kapalı bir havada inşaatı süren yapılar.",
      "projectContent.bas-mazagran-200-38-housing.images.intro.caption": "Konut projesi şantiyesinde hafriyat ve vinç çalışmaları.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.0.alt": "Şantiyenin havadan görünümü. Kumlu bir kazı alanında çalışan gri HIDROMEK ekskavatör, yüklü bir damperli kamyon ve park halinde bir diğeri. Arka planda inşaatı süren bir yapı, konutlar ve tepeler görünüyor.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.0.caption": "Bas Mazagran konut projesinde hafriyat ve zemin hazırlığı.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.1.alt": "Kumlu zeminde derin bir hendek açan ekskavatör ve çalışmayı takip eden iki işçi. Ekskavatör operatörü kabininde. Arka planda dikenli telli beton bir duvar yer alıyor.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.1.caption": "Şantiyede devam eden hafriyat işleri.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.2.alt": "Şantiye zemininde, malzeme yüklü beyaz bir kamyonetin yanında duran iki işçi. Arka planda mavi bir kule vinç ve inşaatı devam eden çok katlı yapılar.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.2.caption": "Bas Mazagran şantiyesinde malzeme sevkiyatı ve inşaat faaliyetleri.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.3.alt": "İnşaatı süren, betonarme iskeletli ve kırmızı tuğla dolgu duvarlı çok katlı konutlar. Ön planda yürüyen bir kişi, arka planda açık mavi bir gökyüzü.",
      "projectContent.bas-mazagran-200-38-housing.images.mosaic.3.caption": "Bas Mazagran konutlarında inşaatın ilerleyişi.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.0.alt": "Kumlu şantiye alanında bir ekskavatör ve iki damperli kamyon. Arka planda, bulutlu bir havada inşaatı devam eden betonarme bir yapı.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.0.caption": "Bas Mazagran konut projesinde hafriyat çalışmaları.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.1.alt": "Şantiyedeki bir ekskavatör ve damperli kamyonlar. Arka planda kazı çukuru ve kaba inşaatı kısmen tamamlanmış bir yapı.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.1.caption": "Bas Mazagran konut projesinde hafriyat ve inşaatın ilk aşamaları.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.2.alt": "İnşaatı süren, betonarme iskeletli ve kırmızı tuğla dolgu duvarlı çok katlı konutlar. Ön planda yürüyen bir kişi, arka planda açık mavi bir gökyüzü.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.2.caption": "Bas Mazagran konutlarında inşaatın ilerleyişi.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.3.alt": "İnşaatın farklı aşamalarındaki betonarme konutların ve mavi bir kule vincin yer aldığı şantiye. Zeminde inşaat malzemeleri ve filiz demirleri seçiliyor.",
      "projectContent.bas-mazagran-200-38-housing.images.featureGallery.3.caption": "Kule vinç eşliğinde ilerleyen konut inşaatı.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.0.alt": "Üzerinde 'HIDROMEK' yazan bir ekskavatör kumlu zeminde hendek açıyor. Hendek içinde iki işçi çalışırken, kırmızı tişörtlü bir başka işçi dışarıda bekliyor. Arka planda dikenli telli beton bir duvar görünüyor.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.0.caption": "Bas Mazagran konut projesinde hafriyat çalışmaları.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.1.alt": "Şantiye zemininde, malzeme torbaları yüklü beyaz bir JMC kamyonet ve yanında iki işçi. Arka planda, parçalı bulutlu gökyüzünün altında mavi bir kule vinç ve inşaatı süren çok katlı yapılar.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.1.caption": "Bas Mazagran şantiyesinde malzeme sevkiyatı ve inşaat çalışmaları.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.2.alt": "Betonarme karkas ve kırmızı tuğla dolgu duvarlı, inşaatı süren çok katlı konut blokları. Ön planda yürüyen bir kişi, arka planda açık mavi gökyüzü.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.2.caption": "Bas Mazagran konut bloklarının inşaatından bir görünüm.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.3.alt": "Şantiyeden geniş bir açı: İnşaatın farklı aşamalarındaki betonarme konut blokları, üst katlardan çıkan filiz demirleri ve solda mavi bir kule vinç. Zeminde çeşitli inşaat malzemeleri bulunuyor.",
      "projectContent.bas-mazagran-200-38-housing.images.constructionGallery.3.caption": "Kule vinç eşliğinde ilerleyen konut inşaatı.",
      "projectContent.bas-mazagran-200-38-housing.images.featured.0.alt": "Betonarme karkas ve kırmızı tuğla dolgu duvarlı, inşaatı süren çok katlı konut blokları. Ön planda yürüyen bir kişi, arka planda açık mavi gökyüzü.",
      "projectContent.bas-mazagran-200-38-housing.images.featured.0.caption": "Bas Mazagran konut bloklarının inşaatından bir görünüm.",
      "projectContent.douira-commercial-centers-2500-housing.title": "Douira | 2500 Konut ve Ticaret Merkezleri",
      "projectContent.douira-commercial-centers-2500-housing.eyebrow": "Karma Kullanım",
      "projectContent.douira-commercial-centers-2500-housing.summary.0": "Douira, Cezayir'de yer alan 2.500 konutluk bir yerleşimin parçası olan iki ticaret merkezi.",
      "projectContent.douira-commercial-centers-2500-housing.summary.1": "Büyük bir konut yerleşiminin günlük ihtiyaçlarına yönelik ticaret ve hizmet birimleri.",
      "projectContent.douira-commercial-centers-2500-housing.description.0": "Douira'daki 2.500 konutluk yerleşimin bir parçası olarak iki ticaret merkezi tamamlandı.",
      "projectContent.douira-commercial-centers-2500-housing.description.1": "İş kapsamında, geniş bir konut master planına entegre iki ticaret merkezi inşa edildi. Bu merkezlerin perakende, hizmet ve dolaşım alanları ile ince işleri tamamlandı.",
      "projectContent.douira-commercial-centers-2500-housing.authority": "Igloo Construction, ticaret merkezi projelerini bu tür yapıların gerektirdiği titizlikle yönetir. Bu projede, geniş bir konut master planına entegre iki ticaret merkezi; perakende, hizmet ve dolaşım alanları ile ince işleriyle birlikte tamamlandı.",
      "projectContent.douira-commercial-centers-2500-housing.seo": "Douira'daki 2.500 konutluk yerleşime hizmet veren iki ticaret merkezi.",
      "projectContent.douira-commercial-centers-2500-housing.meta.0.label": "Proje türü",
