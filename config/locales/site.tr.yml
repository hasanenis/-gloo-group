      "projectContent.douaouda-300-500-housing.images.constructionGallery.2.alt": "Havadan görünüm: Kahverengi çatılı, bej renkli büyük apartman blokları. Çevrelerinde stabilize zemin ve inşaat malzemeleri. Ön planda daha eski ve küçük yapılar, arka planda bulutlu gökyüzü altında deniz.",
      "projectContent.douaouda-300-500-housing.images.constructionGallery.2.caption": "Douaouda'da tamamlanan yeni konutlar.",
      "projectContent.douaouda-300-500-housing.images.constructionGallery.3.alt": "Alçak açıdan görünüm: Açık renkli cepheli ve kahverengi detaylı çok katlı konutlar. Ön planda kum, tuğla ve beyaz çuvalların bulunduğu şantiye alanı. Binaların üzerinde kapalı gökyüzü.",
      "projectContent.douaouda-300-500-housing.images.constructionGallery.3.caption": "Tamamlanmış yeni konutlar ve devam eden saha işleri.",
      "projectContent.douaouda-300-500-housing.images.featured.0.alt": "Geniş bir şantiye. Farklı kaba inşaat aşamalarında çok katlı betonarme konut blokları. Arka planda bir kule vinç, toprak zemin ve kapalı gökyüzü.",
