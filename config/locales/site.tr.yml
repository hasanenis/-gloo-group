      "projectContent.sidi-benour-50-housing.eyebrow": "KONUT PROJESİ",
      "projectContent.sidi-benour-50-housing.summary.0": "Cezayir'in Sidi Benour bölgesinde, 50 adet serbest satışlı konuttan (LPL) oluşan bir projedir.",
      "projectContent.sidi-benour-50-housing.summary.1": "Serbest satışlı konut (LPL) programı çerçevesinde, binaların kaba inşaat işleri tamamlandı.",
      "projectContent.sidi-benour-50-housing.description.0": "Sidi Benour'da, 50 adet serbest satışlı konutun (LPL) kaba inşaat işleri tamamlandı.",
      "projectContent.sidi-benour-50-housing.description.1": "Serbest satışlı konut (LPL) projesinin taşıyıcı sistem ve kaba inşaat işleri, sahada etaplar halinde yürütüldü.",
      "projectContent.sidi-benour-50-housing.authority": "Igloo Construction, serbest satışlı konut (LPL) projelerinin gerektirdiği özenle, konutların taşıyıcı sistem ve kaba inşaat işlerini etaplar halinde tamamladı.",
      "projectContent.sidi-benour-50-housing.seo": "Sidi Benour'daki 50 serbest satışlı konutun R+13 blokta yürütülen taşıyıcı sistem ve kaba inşaat işleri.",
      "projectContent.sidi-benour-50-housing.meta.0.label": "Proje Türü",
