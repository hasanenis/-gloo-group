      "projectContent.douira-commercial-centers-2500-housing.details.2.value": "Yerleşimin günlük ihtiyaçlarına hizmet edecek ticari alanlar.",
      "projectContent.douira-commercial-centers-2500-housing.facilityGroups.0.title": "Proje Bileşenleri",
      "projectContent.douira-commercial-centers-2500-housing.facilityGroups.0.items.0": "Ticaret merkezleri",
      "projectContent.douira-commercial-centers-2500-housing.facilityGroups.0.items.1": "Yerleşimin günlük ihtiyaçlarına hizmet edecek ticari alanlar",
      "projectContent.douira-commercial-centers-2500-housing.faq.0.question": "Rahmania Ticaret Merkezleri nedir?",
      "projectContent.douira-commercial-centers-2500-housing.faq.0.answer": "Douira, Cezayir'de yer alan iki ticaret merkezidir.",
      "projectContent.douira-commercial-centers-2500-housing.faq.1.question": "Projenin kapsamı neydi?",
      "projectContent.douira-commercial-centers-2500-housing.faq.1.answer": "Büyük bir konut yerleşiminin günlük ihtiyaçları için, ana master planla bütünleşik iki ticaret merkezi inşa edildi. Bu merkezler ticari birimler, hizmet alanları ve ortak dolaşım alanlarından oluşur.",
      "projectContent.douira-commercial-centers-2500-housing.faq.2.question": "Projeyi önemli kılan nedir?",
      "projectContent.douira-commercial-centers-2500-housing.faq.2.answer": "Proje, 2.500 konutluk büyük bir yerleşime hizmet veren iki ticaret merkezini, ana konut planıyla bütünleşik bir şekilde çözmesidir.",
      "projectContent.douira-commercial-centers-2500-housing.images.hero.0.alt": "Siyah çerçeveli cam bölme arkasından bir ticari birimin içi: Beyaz duvarlar, karo zemin ve gömme aydınlatmalar. Arka plandaki geniş pencerenin yanında bir çalışan görülüyor.",
      "projectContent.douira-commercial-centers-2500-housing.images.hero.0.caption": "Yeni tamamlanan ticari birimin içi.",
      "projectContent.douira-commercial-centers-2500-housing.images.hero.1.alt": "Açık renkli iki yüksek katlı konut bloku arasında konumlanan, koyu gri paneller ve bakır rengi sövelerle kaplı üç katlı modern ticaret merkezi. Ön planda cadde ve park etmiş bir otomobil.",
      "projectContent.douira-commercial-centers-2500-housing.images.hero.1.caption": "Büyük bir konut yerleşimine hizmet veren ticaret merkezinin tamamlanmış hali.",
      "projectContent.douira-commercial-centers-2500-housing.images.intro.alt": "Aydınlık ve modern bir ticaret merkezinin içinden bir görünüm. Ortada beyaz basamaklı ve paslanmaz çelik korkuluklu çok katlı merdiven dikkat çekiyor. Arka plandaki geniş pencereler mekanı doğal ışıkla dolduruyor.",
      "projectContent.douira-commercial-centers-2500-housing.images.intro.caption": "Çok katlı merdiveniyle modern bir ticaret merkezinin içi.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.0.alt": "Modern bir ticaret merkezi lobisindeki gri granit basamaklı ve parlak paslanmaz çelik korkuluklu, kavisli merdiven. Arka planda beyaz duvarlar ve siyah çerçeveli kapılar.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.0.caption": "Yeni ticaret merkezindeki kavisli merdiven detayı.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.1.alt": "Geniş ve aydınlık bir ticari mekanın içi. Korkulukları koruyucu plastikle kaplanmış iki büyük, kavisli merdiven. Beyaz duvarlar, beton zemin ve arka planda büyük pencereler.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.1.caption": "İnce işler aşamasında, ticaret merkezinin kavisli merdivenli iç mekanı.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.2.alt": "Açık kahverengi kiremit çatı üzerinde, koyu çerçeveli ve yeşilimsi cam panelli, piramit formunda modern bir çatı ışıklığı. Arka planda, parçalı bulutlu gökyüzü altında çok katlı konut blokları.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.2.caption": "Ticaret merkezinden mimari ışıklık detayı.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.3.alt": "Aydınlık ve modern bir ticaret merkezinin içinden bir görünüm. Ortada beyaz basamaklı ve paslanmaz çelik korkuluklu çok katlı merdiven dikkat çekiyor. Arka plandaki geniş pencereler mekanı doğal ışıkla dolduruyor.",
      "projectContent.douira-commercial-centers-2500-housing.images.mosaic.3.caption": "Çok katlı merdiveniyle modern bir ticaret merkezinin içi.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.0.alt": "Açık kahverengi kiremit çatı üzerinde, koyu çerçeveli ve yeşilimsi cam panelli, piramit formunda modern bir çatı ışıklığı. Arka planda, parçalı bulutlu gökyüzü altında çok katlı konut blokları.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.0.caption": "Ticaret merkezinden mimari ışıklık detayı.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.1.alt": "Düz çatıya yeni yerleştirilmiş piramit formlu cam ışıklık. Arka planda bej renkli konut blokları ve mavi gökyüzü. Sol kenarda bir çalışan.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.1.caption": "Ticaret merkezinin piramit formlu çatı ışıklığı.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.2.alt": "Geniş bir ticaret merkezi holünün genel görünümü. Ortada, koruyucu plastikle kaplı metal korkulukları ve koyu granit basamakları olan iki kavisli merdiven bulunuyor. Merdivenlerin arasında beyaz bir kolon yükseliyor. Arka plandaki cam kapı ve pencerelerden içeriye gün ışığı doluyor. Zemin, açık gri brüt beton olarak bırakılmış.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.2.caption": "Ticaret merkezi lobisindeki ikiz kavisli merdivenler, ince işler aşamasında.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.3.alt": "Aydınlık ve modern bir ticaret merkezi lobisinde, gri granit basamaklı ve parlak paslanmaz çelik korkuluklu kavisli merdiven. Arka planda beyaz duvarlar ve siyah çerçeveli kapılar.",
      "projectContent.douira-commercial-centers-2500-housing.images.featureGallery.3.caption": "Yeni ticaret merkezinin kavisli merdiveni.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.0.alt": "Açık kahverengi seramik kaplı çatıda yer alan piramit formlu cam ışıklık. Arka planda bej renkli çok katlı bir yapı ve bulutlu gökyüzü altında konut blokları.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.0.caption": "Mimari detay: Ticaret merkezinin çatı ışıklığı.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.1.alt": "İki yüksek ve açık renkli konut bloğu arasındaki piramit cam çatılı modern ticaret merkezi. Ön planda, inşaatı devam eden dairesel peyzaj alanı ve park etmiş bir tanker. Arka planda, mavi gökyüzü altında diğer konut blokları.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.1.caption": "Douira, Cezayir. Ticaret merkezi ve konut blokları.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.2.alt": "Geniş bir ticaret merkezi holünün genel görünümü. Ortada, koruyucu plastikle kaplı metal korkulukları ve koyu granit basamakları olan iki kavisli merdiven bulunuyor. Merdivenlerin arasında beyaz bir kolon yükseliyor. Arka plandaki cam kapı ve pencerelerden içeriye gün ışığı doluyor. Zemin, açık gri brüt beton olarak bırakılmış.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.2.caption": "Ticaret merkezi lobisindeki ikiz kavisli merdivenler, ince işler aşamasında.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.3.alt": "Aydınlık ve modern bir ticaret merkezinin içi. Ortada beyaz basamaklı ve paslanmaz çelik korkuluklu, katlar arası bağlantıyı sağlayan bir merdiven bulunuyor. Arka plandaki geniş pencereler mekanı aydınlatıyor.",
      "projectContent.douira-commercial-centers-2500-housing.images.constructionGallery.3.caption": "Ticaret merkezinin katlar arası merdiveni ve iç mekanı.",
      "projectContent.douira-commercial-centers-2500-housing.images.featured.0.alt": "Siyah çerçeveli cam bölmenin arkasında, beyaz duvarlı ve seramik zeminli modern bir ticari birim. Arka plandaki geniş pencerenin yanında bir çalışan duruyor; pencereden başka bir bina görünüyor.",
      "projectContent.douira-commercial-centers-2500-housing.images.featured.0.caption": "İnşaatı tamamlanmış ticari birim.",
      "projectContent.reghaia-bouraada-250-housing.title": "Reghaia: 250 Konut, Ticari Birimler ve Hizmet Alanları",
