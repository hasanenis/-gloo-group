      "projectContent.douaouda-300-500-housing.faq.0.answer": "Cezayir'in Tipaza vilayetine bağlı Douaouda'da bulunan bir destekli konut (LPA) projesidir.",
      "projectContent.douaouda-300-500-housing.faq.1.question": "Projenin kapsamı neydi?",
      "projectContent.douaouda-300-500-housing.faq.1.answer": "Konutların kaba ve ince inşaat işleri, saha altyapısı ve çevre düzenlemesi yapıldı.",
      "projectContent.douaouda-300-500-housing.faq.2.question": "Projenin işvereni kimdi?",
      "projectContent.douaouda-300-500-housing.faq.2.answer": "AADL.",
      "projectContent.douaouda-300-500-housing.faq.3.question": "Projenin özelliği nedir?",
      "projectContent.douaouda-300-500-housing.faq.3.answer": "İnce inşaat, saha altyapısı ve çevre düzenlemesi işlerinin tek bir proje dahilinde tamamlanmasıdır.",
      "projectContent.douaouda-300-500-housing.images.hero.0.alt": "Geniş bir şantiye alanında, inşaatlarının farklı aşamalarında olan çok katlı betonarme konut blokları. Arka planda yapıların üzerinde bir kule vinç, kızıl-kahverengi hafriyat toprağı ve bulutlu bir gökyüzü görülüyor.",
      "projectContent.douaouda-300-500-housing.images.hero.0.caption": "Konut bloklarında devam eden kaba inşaat çalışmaları.",
      "projectContent.douaouda-300-500-housing.images.hero.1.alt": "Açık mavi gökyüzü altında bir şantiye. Ön planda hafriyat toprağı ve yeşil bitkiler. Orta planda, tepesinde kırmızı kalıplar olan betonarme bir yapı ve yanında tuğla dolgulu çok katlı bir bina. Gökyüzünde 'UNEN COMANSA' yazılı mavi bir kule vinç, vincin altında beton pompası ve mikser kamyonları bulunuyor. Arka planda deniz görünüyor.",
      "projectContent.douaouda-300-500-housing.images.hero.1.caption": "Douaouda konut projesinde devam eden kaba inşaat.",
      "projectContent.douaouda-300-500-housing.images.intro.alt": "Havadan görünüm: Çevresi stabilize zemin olan, kahverengi çatılı, bej renkli büyük apartman blokları ve şantiye malzemeleri. Ön planda daha eski ve alçak yapılar, arka planda ise bulutlu gökyüzü altında deniz.",
      "projectContent.douaouda-300-500-housing.images.intro.caption": "Douaouda'da yeni tamamlanan konut binaları.",
      "projectContent.douaouda-300-500-housing.images.mosaic.0.alt": "Alçak bir açıdan, açık renkli cepheleri ve kahverengi detayları olan çok katlı konutlar. Ön planda kum yığınları, tuğlalar ve beyaz çuvalların bulunduğu bir şantiye alanı. Yapıların üzerinde bulutlu bir gökyüzü görülüyor.",
      "projectContent.douaouda-300-500-housing.images.mosaic.0.caption": "Yeni tamamlanan konutlar ve devam eden saha çalışmaları.",
      "projectContent.douaouda-300-500-housing.images.mosaic.1.alt": "Geniş bir şantiye. Farklı kaba inşaat aşamalarında çok katlı betonarme konut blokları. Arka planda bir kule vinç, toprak zemin ve kapalı gökyüzü.",
      "projectContent.douaouda-300-500-housing.images.mosaic.1.caption": "Konut bloklarında kaba inşaat.",
      "projectContent.douaouda-300-500-housing.images.mosaic.2.alt": "Açık mavi gökyüzü altında bir şantiye. Ön planda hafriyat alanı ve bitki örtüsü. Orta planda, tepesinde kırmızı kalıplar olan betonarme bir çekirdek ve yanında tuğla dolgulu çok katlı bir bina. Gökyüzüne uzanan 'UNEN COMANSA' yazılı mavi kule vincin altında beton pompası ve mikserler. Uzakta görünen deniz.",
      "projectContent.douaouda-300-500-housing.images.mosaic.2.caption": "Douaouda konut projesinde kaba inşaat.",
      "projectContent.douaouda-300-500-housing.images.mosaic.3.alt": "Havadan görünüm: Kahverengi çatılı, bej renkli büyük apartman blokları. Çevrelerinde stabilize zemin ve inşaat malzemeleri. Ön planda daha eski ve küçük yapılar, arka planda bulutlu gökyüzü altında deniz.",
      "projectContent.douaouda-300-500-housing.images.mosaic.3.caption": "Douaouda'da tamamlanan yeni konutlar.",
      "projectContent.douaouda-300-500-housing.images.featureGallery.0.alt": "Kapalı gökyüzü altında, açık renkli cepheli ve kahverengi detaylı çok katlı konutlar. Ön planda tuğla, kum ve beyaz çuvallar gibi inşaat malzemeleri.",
