      "projectContent.sidi-benour-50-housing.details.1.value": "Serbest satışlı konut (LPL)",
      "projectContent.sidi-benour-50-housing.details.2.label": "Bina Tipi",
      "projectContent.sidi-benour-50-housing.details.2.value": "R+13 Konut Binası",
      "projectContent.sidi-benour-50-housing.details.3.label": "Proje Amacı",
      "projectContent.sidi-benour-50-housing.details.3.value": "Konforlu, kaliteli ve işlevsel modern konutlar inşa etmek.",
      "projectContent.sidi-benour-50-housing.facilityGroups.0.title": "Proje Bileşenleri",
      "projectContent.sidi-benour-50-housing.facilityGroups.0.items.0": "Serbest satışlı konut (LPL)",
      "projectContent.sidi-benour-50-housing.facilityGroups.0.items.1": "R+13 konut binası",
      "projectContent.sidi-benour-50-housing.facilityGroups.0.items.2": "Modern ve işlevsel konut birimleri",
      "projectContent.sidi-benour-50-housing.faq.0.question": "50 adet Serbest Satışlı Konut (LPL) projesi nedir?",
      "projectContent.sidi-benour-50-housing.faq.0.answer": "Cezayir'in Sidi Benour bölgesinde yer alan bir serbest satışlı konut (LPL) projesidir.",
      "projectContent.sidi-benour-50-housing.faq.1.question": "İşin kapsamı neydi?",
      "projectContent.sidi-benour-50-housing.faq.1.answer": "İş, serbest satışlı konutların kaba inşaatını içeriyordu. Yapı imalatları sahada etaplar halinde tamamlandı.",
      "projectContent.sidi-benour-50-housing.faq.2.question": "Bu projenin özelliği nedir?",
      "projectContent.sidi-benour-50-housing.faq.2.answer": "Cezayir, Sidi Benour'daki 50 adet serbest satışlı konutun kaba inşaat işidir. Yapısal imalatlar sahada etaplar halinde tamamlandı.",
      "projectContent.sidi-benour-50-housing.images.hero.0.alt": "İnşaat halindeki çok katlı bir konut binasının dış cephesi. Kapalı bir gökyüzü altında, yapının brüt beton taşıyıcı sistemi ve kırmızı tuğla dolgu duvarları.",
      "projectContent.sidi-benour-50-housing.images.hero.0.caption": "İnşaatı süren konut yapısı ve tuğla dolgu duvarlar.",
      "projectContent.sidi-benour-50-housing.images.hero.1.alt": "İnşaat halindeki çok katlı bir konut binası. Geniş betonarme istinat duvarları, karmaşık demir donatı ağları, üst katlarda çalışan işçiler, baş üstü hizasındaki vinç kolu ve arka plandaki diğer yapılar.",
      "projectContent.sidi-benour-50-housing.images.hero.1.caption": "Sidi Benour'daki konutların kaba inşaatından bir kesit.",
      "projectContent.sidi-benour-50-housing.images.intro.alt": "İnşaat halindeki yüksek bir konut binası. Betonarme karkası, kırmızı tuğla dolgu duvarları ve mavi gökyüzü önünde bir kule vinç. Ön planda, zeminde tuğla yığınları.",
      "projectContent.sidi-benour-50-housing.images.intro.caption": "Sidi Benour'daki 50 konutluk projenin kaba inşaatı.",
      "projectContent.sidi-benour-50-housing.images.mosaic.0.alt": "Kapalı bir havada, inşaat halindeki çok katlı betonarme bir yapının üzerinde duran kule vinç. Binanın üst katlarında iskele ve açıkta bırakılmış donatılar görülüyor.",
      "projectContent.sidi-benour-50-housing.images.mosaic.0.caption": "Konut projesinde kaba inşaat çalışmaları.",
      "projectContent.sidi-benour-50-housing.images.mosaic.1.alt": "Alçak bir beton duvarın arkasından, zemin seviyesinden görülen, çok sayıda balkonlu ve pencereli, yüksek, modern ve açık renkli konut binası.",
      "projectContent.sidi-benour-50-housing.images.mosaic.1.caption": "Sidi Benour, Cezayir'deki konut projesinin tamamlanmış hali.",
      "projectContent.sidi-benour-50-housing.images.mosaic.2.alt": "İnşaat halindeki yüksek bir konut binası; betonarme kolonlar, döşemeler, kırmızı tuğla duvarlar ve balkonlar görülüyor. Solda, yukarı doğru uzanan büyük bir inşaat vinci kısmen görünüyor. Üst kat balkonlarından birinde bir işçi bulunuyor.",
      "projectContent.sidi-benour-50-housing.images.mosaic.2.caption": "Kaba inşaat ve tuğla dolgu duvar çalışmaları ilerliyor.",
      "projectContent.sidi-benour-50-housing.images.mosaic.3.alt": "Bulutlu bir gökyüzü altında, inşaatı devam eden çok katlı bir konut binası. Yapının betonarme karkası ve kırmızı tuğla dolgu duvarları görünüyor.",
      "projectContent.sidi-benour-50-housing.images.mosaic.3.caption": "Tuğla dolgu duvarları örülen konut binası.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.0.alt": "Bir şantiyenin havadan görünüşü: Geniş bir beton temel, yeni kat için hazırlanmış donatı kafesleri, solda bir kule vinç ve yapı üzerinde çalışan işçiler. Uzakta, puslu bir gökyüzünün altında konutlar ve yeşil tepeler seçiliyor.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.0.caption": "Konut projesinde devam eden donatı ve kalıp çalışmaları.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.1.alt": "Çizgili gömlekli ve şapkalı bir işçi, inşaat halindeki bir yapının içinde, istiflenmiş delikli tuğlaların arasında duruyor. Bir duvar açıklığından uzaktaki konutlar ve yeşil alanlar görünüyor.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.1.caption": "Sidi Benour konut projesi şantiyesindeki bir işçi.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.2.alt": "İnşaat halindeki yüksek bir konut binası. Betonarme karkası, kırmızı tuğla dolgu duvarları ve mavi gökyüzü önünde bir kule vinç. Ön planda, zeminde tuğla yığınları.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.2.caption": "Sidi Benour'daki 50 konutluk projenin kaba inşaatı.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.3.alt": "Bulutlu bir gökyüzü altında, inşaatı devam eden çok katlı bir konut binası. Yapının betonarme karkası ve kırmızı tuğla dolgu duvarları görünüyor.",
      "projectContent.sidi-benour-50-housing.images.featureGallery.3.caption": "Tuğla dolgu duvarları örülen konut binası.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.0.alt": "İnşaat halindeki yüksek bir konut binası. Katların betonarme karkası ve yer yer örülmüş kırmızı tuğla duvarları görülüyor. Sol üstte büyük bir kule vinç, arka planda ise gri ve kapalı bir gökyüzü var. Bazı balkonlarda inşaat malzemeleri seçiliyor.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.0.caption": "Sidi Benour'daki 50 konutluk projenin kaba inşaatı.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.1.alt": "İnşaat halindeki çok katlı betonarme yapının alt açıdan görünümü. Üst katlardaki döşemeler, kolonlar ve ahşap iskeleler seçiliyor. Sağ üstte bir vinç bomu görülüyor. Arkadan vuran güneş, parçalı bulutlu gökyüzü önünde yapının silüetini oluşturuyor.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.1.caption": "Gökyüzüne doğru yükselen betonarme yapı.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.2.alt": "İnşaat halindeki yüksek bir konut binası. Betonarme karkası, kırmızı tuğla dolgu duvarları ve mavi gökyüzü önünde bir kule vinç. Ön planda, zeminde tuğla yığınları.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.2.caption": "Sidi Benour'daki 50 konutluk projenin kaba inşaatı.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.3.alt": "İnşaat halindeki çok katlı konut binasının betonarme iskeleti ve kırmızı tuğla dolgu duvarları, bulutlu gökyüzü.",
      "projectContent.sidi-benour-50-housing.images.constructionGallery.3.caption": "Tuğla dolgu duvarları örülen konut binası.",
      "projectContent.sidi-benour-50-housing.images.featured.0.alt": "İnşaat halindeki çok katlı konut binasının betonarme iskeleti ve kırmızı tuğla dolgu duvarları, bulutlu gökyüzü.",
      "projectContent.sidi-benour-50-housing.images.featured.0.caption": "Tuğla dolgu duvarları örülen konut binası.",
      "projectContent.staoueli-11-41-villas.title": "11/41 Villa ve Altyapı İşleri",
      "projectContent.staoueli-11-41-villas.eyebrow": "KONUT PROJESİ",
      "projectContent.staoueli-11-41-villas.summary.0": "Staouali, Cezayir'de yer alan 11/41 Villaları Konut Projesi.",
      "projectContent.staoueli-11-41-villas.summary.1": "Villaların yanı sıra, arazinin tam donanımlı hale gelmesi için gerekli yol ve altyapı şebekeleri de inşa edildi.",
      "projectContent.staoueli-11-41-villas.description.0": "Staoueli'deki 11/41 villaları projesi, yol ve altyapı işlerinin yanı sıra tüm ince inşaat kalemlerini kapsar. Villalar, serbest satışlı konut (LPL) statüsündedir.",
      "projectContent.staoueli-11-41-villas.description.1": "Proje kapsamında konut villaları, yollar, altyapı şebekeleri ve saha altyapısı inşa edildi.",
      "projectContent.staoueli-11-41-villas.authority": "Igloo Construction, serbest satışlı konut (LPL) statüsündeki bu projenin teslimini, gerektirdiği titizlikle yönetti. Villalar; yolları, altyapı şebekeleri ve diğer saha imalatlarıyla birlikte tamamlandı.",
      "projectContent.staoueli-11-41-villas.seo": "Staoueli'deki 11/41 Villaları; yolları, altyapı şebekeleri ve çevre düzenlemesiyle birlikte tamamlandı.",
      "projectContent.staoueli-11-41-villas.meta.0.label": "Proje Türü",
