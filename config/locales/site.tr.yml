      "projectContent.dely-brahim-240-housing.authority": "Igloo Construction, Dely Brahim'deki bu kule yapıda konut, ticari alan, hizmet birimleri, otopark katları ve saha altyapısını aynı yapım düzeni içinde yönetti.",
