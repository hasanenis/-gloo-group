      "projectContent.said-hamdine-mixed-real-estate.nearby.items.0": "Yakındaki dükkânlar",
      "projectContent.said-hamdine-mixed-real-estate.faq.0.question": "Said Hamdine'deki 202 konutluk karma proje nedir?",
      "projectContent.said-hamdine-mixed-real-estate.faq.0.answer": "Proje, Cezayir'in Said Hamdine, Bir Mourad Rais bölgesinde yer alır. Konut ve ticari birimlerden oluşan karma kullanımlı bir yapı kompleksidir.",
      "projectContent.said-hamdine-mixed-real-estate.faq.1.question": "Proje neleri kapsıyordu?",
      "projectContent.said-hamdine-mixed-real-estate.faq.1.answer": "İş kapsamında konut blokları, ticari alanlar, destekleyici yapım işleri ve entegre otopark çözümleri aynı yapı düzeni içinde tamamlandı.",
      "projectContent.said-hamdine-mixed-real-estate.faq.2.question": "Projenin belirgin nitelikleri nelerdir?",
      "projectContent.said-hamdine-mixed-real-estate.faq.2.answer": "Projenin öne çıkan yanı, 202 konutu ticari alanlar ve otopark işlevleriyle birlikte, yoğun kent dokusuna uygun tek bir karma yapı içinde çözmesidir.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.0.alt": "Gün batımında donatılı beton döşemenin üstten görünümü: İnşaat işçileri, beton pompası ve arka plandaki konutlar.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.0.caption": "Gün batımında şantiyede donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.1.alt": "Alçak açıdan görünüm: Balkonlu, beyaz, bej ve gri cepheli, yansıtıcı camlı zemin katları olan iki modern yüksek bina.",
      "projectContent.said-hamdine-mixed-real-estate.images.hero.1.caption": "Modern konut bloklarından bir cephe görünümü.",
      "projectContent.said-hamdine-mixed-real-estate.images.intro.alt": "Gün batımında şantiye manzarası: İnşaat işçileri sık donatılı bir beton döşeme hazırlıyor, arka planda bir beton pompası bulunuyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.intro.caption": "Gün batımında şantiyede donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.0.alt": "Şantiyenin kuş bakışı görünümü: Geniş kazı çukurunun beton tabanında, turuncu yelekli işçiler bina temeli için donatı ağlarını yerleştirip bağlıyor. Arka planda, çukurun dik ve desteklenmiş toprak duvarları görünüyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.0.caption": "Temel inşaatında donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.1.alt": "Modern bir balkon: Ahşap görünümlü seramik zemin, cam korkuluk, küçük yuvarlak bir masa ve üç koyu renkli sandalye. Arka planda diğer apartmanlar görünüyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.1.caption": "Daireye ait modern tasarımlı balkon.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.2.alt": "Yüksek ve modern bir konut binasının alttan görünümü: Cam korkuluklu balkonlar, yansıtıcı camlı ticari zemin kat, arka planda mavi gökyüzü ve ay. Sağda kısmen görünen yeşil bir ağaç.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.2.caption": "Gün doğumu veya batımında, karma kullanımlı modern bir binanın cephesi.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.3.alt": "Gün batımında donatılı beton döşemenin üstten görünümü: İnşaat işçileri, beton pompası ve arka plandaki konutlar.",
      "projectContent.said-hamdine-mixed-real-estate.images.mosaic.3.caption": "Gün batımında şantiyede donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.0.alt": "İş yelekli inşaat işçileri, istinat duvarları görünen derin bir kazı çukurunda bina temeli için çelik donatı montajı yapıyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.0.caption": "Temel inşaatında donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.1.alt": "Beyaz duvarlı ve koyu kahverengi parlak seramik zeminli boş bir koridor. Açık kapılar yemek alanı ve yatak odası gibi diğer odalara açılıyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.1.caption": "Daire içindeki odaları birbirine bağlayan geniş ve modern koridor.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.2.alt": "Şantiyenin kuş bakışı görünümü: Geniş kazı çukurunun beton tabanında, turuncu yelekli işçiler bina temeli için donatı ağlarını yerleştirip bağlıyor. Arka planda, çukurun dik ve desteklenmiş toprak duvarları görünüyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.2.caption": "Temel inşaatında donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.3.alt": "Ahşap görünümlü seramik zeminli ve cam korkuluklu modern bir balkonda küçük, yuvarlak bir masa ve üç koyu renk sandalye bulunuyor. Arka planda diğer apartmanlar seçiliyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.featureGallery.3.caption": "Konforlu bir dış mekân olarak tasarlanan balkon.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.0.alt": "İnşaatı devam eden çok katlı bina. Betonarme döşemeler, kolonlar ve kırmızı tuğla duvarlar. Yan cepheden sarkan sarı moloz olukları, alt katlardaki inşaat malzemeleri ve arka plandaki vinç.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.0.caption": "Sidi Yahia projesinde devam eden kaba inşaat çalışmaları.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.1.alt": "Bulutlu bir gökyüzü önünde inşaatı devam eden yüksek bina. Betonarme iskeleti, kısmen tamamlanmış kırmızı tuğla duvarları ve sarı moloz olukları seçiliyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.1.caption": "Çok katlı binada betonarme ve tuğla duvar imalatı.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.2.alt": "Şantiyenin kuş bakışı görünümü. Geniş bir kazı çukurunun betonlanmış tabanında, turuncu yelekli işçiler bina temeli için donatı ağlarını yerleştirip bağlıyor. Arka planda çukurun stabilize edilmiş dik toprak duvarları seçiliyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.2.caption": "Temel inşaatı sırasında donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.3.alt": "Derin bir kazı çukurunda, iş güvenliği yeleği giyen işçiler, büyük bir bina temeli için çelik donatı montajı yapıyor. Çukurun çevresindeki istinat duvarları görülüyor.",
      "projectContent.said-hamdine-mixed-real-estate.images.constructionGallery.3.caption": "Temel inşaatı sırasında donatı montajı.",
      "projectContent.said-hamdine-mixed-real-estate.images.featured.0.alt": "Gün batımında, donatıları döşenmiş betonarme bir döşemenin üzerinden şantiye görünümü. Beton pompası, işçiler ve arka plandaki konut binaları.",
      "projectContent.said-hamdine-mixed-real-estate.images.featured.0.caption": "Gün batımında şantiyede donatı montajı.",
      "projectContent.sidi-abdallah-200-1200-housing.title": "200/1200 Kamu Konutu (LPP)",
      "projectContent.sidi-abdallah-200-1200-housing.eyebrow": "KARMA KULLANIMLI PROJE",
      "projectContent.sidi-abdallah-200-1200-housing.summary.0": "200/1200 Kamu Konutu (LPP), Cezayir'in Sidi Abdellah kentinde yer alan karma kullanımlı bir projedir.",
      "projectContent.sidi-abdallah-200-1200-housing.summary.1": "Büyük ölçekli bu sözleşme kapsamında, konut bloklarının yanı sıra ortak kullanım yapıları ve altyapı işleri de tamamlandı.",
      "projectContent.sidi-abdallah-200-1200-housing.description.0": "Igloo Construction, Sidi Abdallah-Mahalma'da yer alan 200/1200 kamu konutu (LPP) projesinde, konutların yanı sıra tüm tamamlayıcı yapı işlerini üstlendi.",
      "projectContent.sidi-abdallah-200-1200-housing.description.1": "Bu büyük ölçekli kamu konutu projesinde, konut bloklarıyla birlikte ortak kullanım yapıları, altyapı ve saha düzenlemeleri de tamamlandı.",
      "projectContent.sidi-abdallah-200-1200-housing.authority": "Igloo Construction, büyük ölçekli kamu konutu (LPP) projelerini yönetme deneyimine sahiptir. Bu tür işlerde konutların yanı sıra tüm altyapı ve çevre düzenlemesini de birlikte inşa eder.",
      "projectContent.sidi-abdallah-200-1200-housing.seo": "Sidi Abdallah'taki 200/1200 kamu konutu projesi; R+9 bloklar, ticari birimler ve mesleki kullanım alanları.",
      "projectContent.sidi-abdallah-200-1200-housing.meta.0.label": "Proje Türü",
      "projectContent.sidi-abdallah-200-1200-housing.meta.0.value": "Kamu Konutu (LPP)",
      "projectContent.sidi-abdallah-200-1200-housing.details.0.label": "Konum",
      "projectContent.sidi-abdallah-200-1200-housing.details.0.value": "Sidi Abdellah, Alger, Cezayir",
      "projectContent.sidi-abdallah-200-1200-housing.details.1.label": "Proje Türü",
      "projectContent.sidi-abdallah-200-1200-housing.details.1.value": "Kamu Konutu (LPP)",
      "projectContent.sidi-abdallah-200-1200-housing.details.2.label": "Bina Tipolojisi",
      "projectContent.sidi-abdallah-200-1200-housing.details.2.value": "R+9",
