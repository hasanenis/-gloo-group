      "projectContent.said-hamdine-mixed-real-estate.title": "Said Hamdine 202 Konutluk Karma Kompleks",
      "projectContent.said-hamdine-mixed-real-estate.eyebrow": "KARMA KULLANIMLI PROJE",
      "projectContent.said-hamdine-mixed-real-estate.summary.0": "Said Hamdine'deki bu karma proje, 202 konutu ticari birimler ve entegre otopark çözümleriyle birlikte ele alır.",
      "projectContent.said-hamdine-mixed-real-estate.summary.1": "Yüksek yoğunluklu bir yerleşim olan bu proje; konut blokları, yeraltı otoparkı ve koordineli yapısal destek işlerinden oluşur.",
      "projectContent.said-hamdine-mixed-real-estate.description.0": "Proje kapsamında 202 konutluk karma yapının ince işleri, ticari alanları ve entegre otopark çözümleri birlikte tamamlandı.",
      "projectContent.said-hamdine-mixed-real-estate.description.1": "Yüksek yoğunluklu bu karma projede konut blokları, yeraltı otoparkı ve yapısal destek sistemleri bir bütün olarak ele alındı.",
      "projectContent.said-hamdine-mixed-real-estate.authority": "Igloo Construction, Said Hamdine'deki bu karma yapının konut, ticari alan ve destekleyici yapı işlerini tek şantiye disipliniyle yönetti.",
      "projectContent.said-hamdine-mixed-real-estate.seo": "Said Hamdine'deki 202 konutluk karma projenin galerisini, teknik içeriğini ve proje bilgilerini inceleyin.",
