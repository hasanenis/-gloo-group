      "projectContent.bas-mazagran-200-38-housing.summary.0": "Mostaganem vilayetinin Bas Mazagran bölgesindeki proje, 200 adet destekli konut (LPA) ve 38 adet serbest satışlı konut (LPL) ile bu birimlere ait ticari alanlar, yollar ve altyapı ağlarından oluşur.",
      "projectContent.bas-mazagran-200-38-housing.summary.1": "İşveren: OPGI",
      "projectContent.bas-mazagran-200-38-housing.description.0": "Bas Mazagran'da 200 destekli (LPA) ve 38 serbest satışlı (LPL) konut ile bu konutlara ait ticari birimler, yollar ve altyapı ağları inşa edildi.",
      "projectContent.bas-mazagran-200-38-housing.description.1": "Bu karma projede, destekli ve serbest satışlı konut tipleri ticari kullanımlarla bir arada çözüldü. İşin kapsamında konutlar, ticari birimler, yollar ve hizmet şebekeleri yer aldı.",
      "projectContent.bas-mazagran-200-38-housing.authority": "Igloo Construction, Bas Mazagran'daki bu kıyı projesinde konut bloklarını, ticari birimleri ve VRD işlerini aynı saha organizasyonu içinde yürüttü.",
      "projectContent.bas-mazagran-200-38-housing.seo": "Bas Mazagran'daki 200 LPA ve 38 LPL konutluk kıyı projesinin galerisini, teknik içeriğini ve proje bilgilerini inceleyin.",
