      "projectContent.said-hamdine-mixed-real-estate.facilityGroups.0.items.1": "202 adet serbest satışlı konut (LPL)",
      "projectContent.said-hamdine-mixed-real-estate.facilityGroups.0.items.2": "5 konut bloğu",
